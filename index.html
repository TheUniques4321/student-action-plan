<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Action Plan</title>

  <!-- Exact Google Fonts Import -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Source+Sans+3:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>
    /* =========================================================
       1. EXACT DESIGN TOKENS
       ========================================================= */
    :root {
      color-scheme: dark;

      /* Typography */
      --font-display: "Newsreader", Georgia, serif;
      --font-ui: "Source Sans 3", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;

      /* Surfaces */
      --canvas: #141310;
      --surface-1: #1b1916;
      --surface-2: #211f1b;
      --surface-3: #28251f;

      /* Text */
      --text-primary: #eee9df;
      --text-secondary: #c4bdb1;
      --text-muted: #8c8579;
      --text-interactive: #aaa195;
      --text-faint: #686259;

      /* Borders */
      --border-subtle: rgba(238, 233, 223, 0.06);
      --border-default: rgba(238, 233, 223, 0.105);
      --border-strong: rgba(238, 233, 223, 0.18);

      /* Accent */
      --accent: #c39161;
      --accent-hover: #d0a071;

      /* Semantic */
      --danger: #cf776e;
      --info: #8297a4;
      --success: #829b7a;

      /* Layout */
      --content-width: 960px;

      /* Shape */
      --radius-card: 7px;
      --radius-control: 6px;

      /* Motion */
      --transition-fast: 150ms ease;
    }

    /* =========================================================
       2. RESET & BASE
       ========================================================= */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      margin: 0;

      font-family: var(--font-ui);
      font-size: 16px;
      font-weight: 400;
      line-height: 1.5;

      color: var(--text-primary);

      background:
        radial-gradient(
          circle at 18% -8%,
          rgba(195, 145, 97, 0.05),
          transparent 520px
        ),
        radial-gradient(
          circle at 88% 28%,
          rgba(255, 255, 255, 0.015),
          transparent 440px
        ),
        var(--canvas);

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* Exact noise overlay */
    body::before {
      content: "";

      position: fixed;
      inset: 0;
      z-index: 9999;

      pointer-events: none;

      opacity: 0.022;

      background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='.55'/%3E%3C/svg%3E");
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    /* =========================================================
       3. PAGE SHELL
       ========================================================= */
    .page-shell {
      width: min(calc(100% - 32px), var(--content-width));
      margin-inline: auto;

      padding-top: 24px;
      padding-bottom: 80px;
    }

    @media (min-width: 768px) {
      .page-shell {
        padding-top: 24px;
      }
    }

    /* =========================================================
       4. APPLICATION HEADER
       ========================================================= */
    .app-header {
      display: grid;
      gap: 18px;

      margin-bottom: 56px;
    }

    .app-header__top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 24px;
    }

    @media (max-width: 639px) {
      .app-header__top {
        display: grid;
        gap: 7px;
      }
    }

    .app-title {
      margin: 0;

      font-family: var(--font-display);
      font-size: 26px;
      font-weight: 600;
      line-height: 1.05;
      letter-spacing: -0.018em;

      color: var(--text-primary);
    }

    .header-context {
      display: flex;
      align-items: center;
      gap: 7px;

      font-size: 14px;
      line-height: 1.3;

      color: var(--text-muted);
    }

    .student-switcher {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .student-choice {
      min-height: 40px;

      padding: 0 13px;

      border: 1px solid var(--border-default);
      border-radius: var(--radius-control);

      font-family: var(--font-ui);
      font-size: 15px;
      font-weight: 500;

      color: var(--text-secondary);
      background: transparent;
      cursor: pointer;
      transition: border-color var(--transition-fast), color var(--transition-fast), background-color var(--transition-fast);
    }

    .student-choice:hover {
      border-color: var(--border-strong);
      color: var(--text-primary);
    }

    .student-choice[aria-current="true"] {
      border-color: var(--accent);
      color: var(--text-primary);
      background: rgba(195, 145, 97, 0.09);
    }

    .change-student {
      display: inline-flex;
      align-items: center;

      min-height: 40px;

      margin-left: 2px;
      padding: 0 8px;

      border: 0;

      font-family: var(--font-ui);
      font-size: 15px;
      font-weight: 400;

      color: var(--text-interactive);
      background: transparent;

      text-decoration: underline;
      text-decoration-color: rgba(170, 161, 149, 0.3);
      text-underline-offset: 3px;
      cursor: pointer;
    }

    .change-student:hover,
    .change-student:focus-visible {
      color: var(--text-primary);
      text-decoration-color: currentColor;
    }

    .inline-custom-student {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .inline-custom-student input {
      font-family: var(--font-ui);
      font-size: 14px;
      padding: 6px 10px;
      background: var(--canvas);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-control);
      color: var(--text-primary);
      outline: none;
      width: 140px;
    }

    .inline-custom-student input:focus {
      border-color: var(--accent);
    }

    .inline-custom-student button {
      font-family: var(--font-ui);
      font-size: 13px;
      font-weight: 600;
      padding: 6px 12px;
      background: var(--surface-3);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-control);
      color: var(--text-primary);
      cursor: pointer;
    }

    /* =========================================================
       5. PROJECT STRUCTURE & TYPOGRAPHY
       ========================================================= */
    .project-header {
      margin-bottom: 28px;
    }

    .project-eyebrow {
      margin-bottom: 7px;

      font-family: var(--font-ui);
      font-size: 12px;
      font-weight: 600;
      line-height: 1;

      letter-spacing: 0.105em;
      text-transform: uppercase;

      color: var(--text-muted);
    }

    .project-title {
      max-width: 22ch;
      margin: 0;

      font-family: var(--font-display);
      font-size: clamp(34px, 3.1vw, 44px);
      font-weight: 600;
      line-height: 1.03;

      letter-spacing: -0.018em;

      color: var(--text-primary);

      text-wrap: balance;
    }

    .project-summary {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px 12px;

      margin-top: 12px;

      font-family: var(--font-ui);
      font-size: 14px;
      font-weight: 400;
      line-height: 1.3;

      color: var(--text-muted);
    }

    .project + .project {
      margin-top: 64px;
      padding-top: 48px;

      border-top: 1px solid var(--border-subtle);
    }

    /* =========================================================
       6. TASK LIST & CARDS
       ========================================================= */
    .task-list {
      display: grid;
      gap: 10px;
    }

    .task-card {
      position: relative;

      display: grid;

      padding: 22px 24px;

      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-card);

      background:
        linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.014),
          rgba(255, 255, 255, 0)
        ),
        var(--surface-1);

      box-shadow: none;

      transition:
        background-color var(--transition-fast),
        border-color var(--transition-fast);
    }

    .task-card:hover,
    .task-card:focus-within {
      border-color: var(--border-default);
      background-color: var(--surface-2);
    }

    .task-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: start;

      gap: 16px;
    }

    .task-title {
      max-width: 66ch;
      margin: 0;

      font-family: var(--font-ui);
      font-size: 17px;
      font-weight: 600;
      line-height: 1.34;

      letter-spacing: -0.004em;

      color: var(--text-primary);
    }

    .task-edit {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-width: 44px;
      min-height: 40px;

      margin-top: -8px;
      margin-right: -8px;

      padding: 0 8px;

      border: 0;

      font-family: var(--font-ui);
      font-size: 14px;
      font-weight: 500;
      line-height: 1;

      color: var(--text-interactive);
      background: transparent;
      cursor: pointer;
      transition: color var(--transition-fast);
    }

    .task-edit:hover,
    .task-edit:focus-visible {
      color: var(--text-primary);
    }

    .task-description {
      max-width: 58ch;

      margin-top: 8px;
      margin-bottom: 0;

      font-family: var(--font-ui);
      font-size: 16px;
      font-weight: 400;
      line-height: 1.52;

      color: var(--text-secondary);
    }

    .task-footer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;

      gap: 6px 20px;

      margin-top: 18px;
    }

    .task-meta-item {
      font-family: var(--font-ui);
      font-size: 14px;
      font-weight: 400;
      line-height: 1.3;

      color: var(--text-muted);
    }

    .task-attention {
      display: inline-flex;
      align-items: center;
      gap: 7px;

      font-family: var(--font-ui);
      font-size: 14px;
      font-weight: 600;

      color: var(--danger);
    }

    .task-attention::before {
      content: "";

      width: 6px;
      height: 6px;

      border-radius: 50%;

      background: currentColor;
    }

    /* In-place task editing controls */
    .task-edit-form {
      display: grid;
      gap: 12px;
    }

    .edit-field,
    .edit-select {
      inline-size: 100%;
      min-block-size: 42px;

      padding: 0.65rem 0.75rem;

      font-family: var(--font-ui);
      font-size: 16px;
      line-height: 1.4;

      color: var(--text-primary);
      background: var(--canvas);

      border: 1px solid var(--border-default);
      border-radius: var(--radius-control);

      outline: none;
    }

    .edit-field:focus,
    .edit-select:focus {
      border-color: var(--border-strong);
      box-shadow: 0 0 0 3px rgba(195, 145, 97, 0.11);
    }

    .edit-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .edit-group {
      display: grid;
      gap: 4px;
    }

    .edit-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .edit-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      padding-top: 4px;
    }

    .save-button {
      min-block-size: 40px;
      padding-inline: 16px;

      border: 1px solid var(--accent);
      border-radius: var(--radius-control);

      font-family: var(--font-ui);
      font-size: 14px;
      font-weight: 600;

      color: #17130f;
      background: var(--accent);
      cursor: pointer;
      transition: background-color var(--transition-fast);
    }

    .save-button:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    .cancel-button {
      min-block-size: 40px;
      padding-inline: 12px;

      border: 0;
      font-family: var(--font-ui);
      font-size: 14px;
      color: var(--text-muted);
      background: transparent;
      cursor: pointer;
    }

    .cancel-button:hover {
      color: var(--text-primary);
    }

    /* =========================================================
       7. MOBILE RULES (< 640px)
       ========================================================= */
    @media (max-width: 639px) {
      .task-card {
        padding: 18px 16px;
      }

      .task-header {
        gap: 10px;
      }

      .project-title {
        font-size: 34px;
      }

      .project + .project {
        margin-top: 56px;
        padding-top: 40px;
      }

      .task-footer {
        gap: 7px 16px;
      }

      .edit-row {
        grid-template-columns: 1fr;
      }
    }

    .loading-notice {
      font-size: 14px;
      color: var(--text-muted);
      font-style: italic;
      padding: 24px 0;
    }
  </style>
</head>

<body>
  <div class="page-shell">

    <!-- APPLICATION HEADER -->
    <header class="app-header">
      <div class="app-header__top">
        <h1 class="app-title">Student Action Plan</h1>
        <div class="header-context" id="header-context">Loading…</div>
      </div>

      <nav class="student-switcher" aria-label="Student selector">
        <button
          type="button"
          class="student-choice"
          id="choice-peter"
          aria-current="false"
          onclick="selectStudent('PETER-KIM')"
        >Peter Kim</button>

        <button
          type="button"
          class="student-choice"
          id="choice-paul"
          aria-current="false"
          onclick="selectStudent('PAUL-KIM')"
        >Paul Kim</button>

        <button
          type="button"
          class="change-student"
          id="btn-change-student"
          onclick="toggleCustomStudentPrompt()"
        >Change student</button>

        <div id="custom-student-container" class="inline-custom-student" style="display: none;">
          <input type="text" id="custom-student-input" placeholder="Enter student ID">
          <button type="button" onclick="handleCustomStudentLoad()">Load</button>
        </div>
      </nav>
    </header>

    <!-- PROJECTS LIST -->
    <main id="projects-container">
      <div class="loading-notice">Loading projects and tasks…</div>
    </main>

  </div>

  <!-- APPLICATION SCRIPT -->
  <script>
    "use strict";

    const CONFIG = {
      scriptUrl: "https://script.google.com/macros/s/AKfycbzivDKDfsgEKyza4GHL8D-NmkgcdKKn0zuT1kxeR6ZDxDGOz8X069Kpg9lnPfgpNrfmIw/exec",
      defaultStudent: "PETER-KIM"
    };

    const state = {
      currentStudent: getInitialStudent(),
      projects: [],
      editingTaskId: null,
      lastUpdated: null
    };

    function getInitialStudent() {
      const param = new URLSearchParams(window.location.search).get("student");
      return (param ? param.trim().toUpperCase() : "") || localStorage.getItem("sap_active_student") || CONFIG.defaultStudent;
    }

    function selectStudent(studentId) {
      if (!studentId) return;
      state.currentStudent = studentId.trim().toUpperCase();
      state.editingTaskId = null;
      localStorage.setItem("sap_active_student", state.currentStudent);

      const url = new URL(window.location.href);
      url.searchParams.set("student", state.currentStudent);
      window.history.pushState({}, "", url);

      updateStudentButtons();
      fetchPlan();
    }

    function updateStudentButtons() {
      const isPeter = state.currentStudent === "PETER-KIM";
      const isPaul = state.currentStudent === "PAUL-KIM";

      const peterBtn = document.getElementById("choice-peter");
      const paulBtn = document.getElementById("choice-paul");

      if (peterBtn) peterBtn.setAttribute("aria-current", isPeter ? "true" : "false");
      if (paulBtn) paulBtn.setAttribute("aria-current", isPaul ? "true" : "false");
    }

    function toggleCustomStudentPrompt() {
      const container = document.getElementById("custom-student-container");
      if (!container) return;
      const isOpen = container.style.display !== "none";
      container.style.display = isOpen ? "none" : "inline-flex";
      if (!isOpen) {
        document.getElementById("custom-student-input")?.focus();
      }
    }

    function handleCustomStudentLoad() {
      const input = document.getElementById("custom-student-input");
      const val = input?.value.trim();
      if (val) {
        selectStudent(val);
        input.value = "";
        toggleCustomStudentPrompt();
      }
    }

    async function fetchPlan() {
      const container = document.getElementById("projects-container");
      container.innerHTML = `<div class="loading-notice">Loading projects and tasks…</div>`;

      try {
        const url = `${CONFIG.scriptUrl}?student=${encodeURIComponent(state.currentStudent)}&_t=${Date.now()}`;
        const res = await fetch(url, { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const data = await res.json();
        state.lastUpdated = data.lastUpdated ? new Date(data.lastUpdated) : new Date();
        parseProjects(data);
        updateHeaderContext();
        renderProjects();

      } catch (err) {
        console.error("Fetch error:", err);
        container.innerHTML = `<div class="loading-notice">Unable to load data. Please check connection and refresh.</div>`;
      }
    }

    function parseProjects(data) {
      let projectList = [];

      if (data.actionBrief && Array.isArray(data.actionBrief.projects)) {
        projectList = data.actionBrief.projects.map(p => {
          const tasks = [
            ...(p.roles?.student || []),
            ...(p.roles?.parent || []),
            ...(p.roles?.me || [])
          ];
          return {
            projectId: p.projectId,
            projectName: p.projectName,
            categoryCode: p.categoryCode || "",
            projectStatus: p.projectStatus || "active",
            targetDate: p.targetDate || "",
            notes: p.notes || "",
            tasks: tasks
          };
        });
      } else {
        const allTodos = Array.isArray(data.todos) ? data.todos : [];
        const map = new Map();
        allTodos.forEach(t => {
          const pId = t.projectId || "PRJ-GENERAL";
          if (!map.has(pId)) {
            map.set(pId, {
              projectId: pId,
              projectName: t.projectName || "General",
              categoryCode: "",
              projectStatus: "active",
              targetDate: "",
              notes: "",
              tasks: []
            });
          }
          map.get(pId).tasks.push(t);
        });
        projectList = Array.from(map.values());
      }

      state.projects = projectList.filter(p => p.tasks.length > 0);
    }

    function updateHeaderContext() {
      const totalOpenTasks = state.projects.reduce((acc, p) => acc + p.tasks.length, 0);
      const timeString = formatClockTime(state.lastUpdated);
      const headerContext = document.getElementById("header-context");
      if (headerContext) {
        headerContext.textContent = `${totalOpenTasks} open task${totalOpenTasks === 1 ? "" : "s"} · Updated ${timeString}`;
      }
    }

    function renderProjects() {
      const container = document.getElementById("projects-container");
      if (!container) return;

      if (state.projects.length === 0) {
        container.innerHTML = `<div class="loading-notice">No active projects or tasks.</div>`;
        return;
      }

      container.innerHTML = "";

      state.projects.forEach(project => {
        const projectEl = document.createElement("section");
        projectEl.className = "project";

        // Header
        const header = document.createElement("header");
        header.className = "project-header";

        // Eyebrow
        const eyebrowText = formatCategoryEyebrow(project.categoryCode);
        if (eyebrowText) {
          const eyebrow = document.createElement("div");
          eyebrow.className = "project-eyebrow";
          eyebrow.textContent = eyebrowText;
          header.appendChild(eyebrow);
        }

        // Title
        const title = document.createElement("h2");
        title.className = "project-title";
        title.textContent = project.projectName;
        header.appendChild(title);

        // Summary
        const summary = document.createElement("div");
        summary.className = "project-summary";

        const parts = [];
        if (project.targetDate) {
          parts.push(`Target ${formatShortMonthDay(project.targetDate)}`);
        }
        parts.push(`${project.tasks.length} open task${project.tasks.length === 1 ? "" : "s"}`);

        const waitingCount = project.tasks.filter(t => isWaiting(t)).length;
        if (waitingCount > 0) {
          parts.push(`${waitingCount} waiting`);
        }

        parts.forEach((txt, idx) => {
          if (idx > 0) {
            const sep = document.createElement("span");
            sep.setAttribute("aria-hidden", "true");
            sep.textContent = "·";
            summary.appendChild(sep);
          }
          const item = document.createElement("span");
          item.textContent = txt;
          summary.appendChild(item);
        });

        header.appendChild(summary);
        projectEl.appendChild(header);

        // Task List
        const taskList = document.createElement("div");
        taskList.className = "task-list";

        project.tasks.forEach(task => {
          taskList.appendChild(renderTaskCard(task, project.projectId));
        });

        projectEl.appendChild(taskList);
        container.appendChild(projectEl);
      });
    }

    function renderTaskCard(task, projectId) {
      const card = document.createElement("article");
      card.className = "task-card";

      if (state.editingTaskId === task.workItemId) {
        // Edit Form
        const form = document.createElement("form");
        form.className = "task-edit-form";
        form.onsubmit = (e) => handleSaveTask(e, task.workItemId);

        // Title
        const titleGroup = document.createElement("div");
        titleGroup.className = "edit-group";
        const titleLabel = document.createElement("label");
        titleLabel.className = "edit-label";
        titleLabel.textContent = "Task title";
        const titleInput = document.createElement("input");
        titleInput.type = "text";
        titleInput.className = "edit-field";
        titleInput.id = `edit-title-${task.workItemId}`;
        titleInput.value = task.title || "";
        titleInput.required = true;
        titleGroup.append(titleLabel, titleInput);

        // Description
        const descGroup = document.createElement("div");
        descGroup.className = "edit-group";
        const descLabel = document.createElement("label");
        descLabel.className = "edit-label";
        descLabel.textContent = "Description";
        const descInput = document.createElement("textarea");
        descInput.className = "edit-field";
        descInput.rows = 2;
        descInput.id = `edit-desc-${task.workItemId}`;
        descInput.value = task.notes || "";
        descGroup.append(descLabel, descInput);

        // Row for Due Date & Status
        const row = document.createElement("div");
        row.className = "edit-row";

        const dueGroup = document.createElement("div");
        dueGroup.className = "edit-group";
        const dueLabel = document.createElement("label");
        dueLabel.className = "edit-label";
        dueLabel.textContent = "Due date";
        const dueInput = document.createElement("input");
        dueInput.type = "date";
        dueInput.className = "edit-field";
        dueInput.id = `edit-due-${task.workItemId}`;
        dueInput.value = task.dueDate || "";
        dueGroup.append(dueLabel, dueInput);

        const statusGroup = document.createElement("div");
        statusGroup.className = "edit-group";
        const statusLabel = document.createElement("label");
        statusLabel.className = "edit-label";
        statusLabel.textContent = "Status";
        const statusSelect = document.createElement("select");
        statusSelect.className = "edit-select";
        statusSelect.id = `edit-status-${task.workItemId}`;

        const statusOptions = [
          { val: "ready", label: "Ready" },
          { val: "in_progress", label: "In progress" },
          { val: "waiting", label: "Waiting" },
          { val: "planned", label: "Planned" },
          { val: "review", label: "Review" },
          { val: "done", label: "Done" }
        ];

        const curStatus = String(task.itemStatus || "").toLowerCase();
        statusOptions.forEach(opt => {
          const optEl = document.createElement("option");
          optEl.value = opt.val;
          optEl.textContent = opt.label;
          if (curStatus === opt.val || (opt.val === "done" && (curStatus === "complete" || curStatus === "done"))) {
            optEl.selected = true;
          }
          statusSelect.appendChild(optEl);
        });

        statusGroup.append(statusLabel, statusSelect);
        row.append(dueGroup, statusGroup);

        // Actions
        const actions = document.createElement("div");
        actions.className = "edit-actions";

        const cancelBtn = document.createElement("button");
        cancelBtn.type = "button";
        cancelBtn.className = "cancel-button";
        cancelBtn.textContent = "Cancel";
        cancelBtn.onclick = () => {
          state.editingTaskId = null;
          renderProjects();
        };

        const saveBtn = document.createElement("button");
        saveBtn.type = "submit";
        saveBtn.className = "save-button";
        saveBtn.textContent = "Save";

        actions.append(cancelBtn, saveBtn);
        form.append(titleGroup, descGroup, row, actions);
        card.appendChild(form);
        return card;
      }

      // Normal Card View
      const taskHeader = document.createElement("header");
      taskHeader.className = "task-header";

      const title = document.createElement("h3");
      title.className = "task-title";
      title.textContent = task.title;

      const editBtn = document.createElement("button");
      editBtn.className = "task-edit";
      editBtn.type = "button";
      editBtn.textContent = "Edit";
      editBtn.onclick = () => {
        state.editingTaskId = task.workItemId;
        renderProjects();
      };

      taskHeader.append(title, editBtn);
      card.appendChild(taskHeader);

      if (task.notes) {
        const desc = document.createElement("p");
        desc.className = "task-description";
        desc.textContent = task.notes;
        card.appendChild(desc);
      }

      // Footer
      const footer = document.createElement("footer");
      footer.className = "task-footer";

      // 1. Due Date
      if (task.dueDate) {
        const dueMeta = document.createElement("span");
        dueMeta.className = "task-meta-item";
        dueMeta.textContent = `Due ${formatShortMonthDay(task.dueDate)}`;
        footer.appendChild(dueMeta);
      }

      // 2. Lifecycle Status
      const statusMeta = document.createElement("span");
      statusMeta.className = "task-meta-item";
      statusMeta.textContent = formatLifecycleStatus(task.itemStatus);
      footer.appendChild(statusMeta);

      // 3. Owner
      const ownerName = resolveOwnerText(task);
      if (ownerName) {
        const ownerMeta = document.createElement("span");
        ownerMeta.className = "task-meta-item";
        ownerMeta.textContent = ownerName;
        footer.appendChild(ownerMeta);
      }

      // 4. Overdue / Due Attention
      const attentionText = getDueAttention(task.dueDate);
      if (attentionText) {
        const attention = document.createElement("span");
        attention.className = "task-attention";
        attention.textContent = attentionText;
        footer.appendChild(attention);
      }

      card.appendChild(footer);
      return card;
    }

    function handleSaveTask(e, workItemId) {
      e.preventDefault();
      const title = document.getElementById(`edit-title-${workItemId}`)?.value.trim();
      const notes = document.getElementById(`edit-desc-${workItemId}`)?.value.trim();
      const dueDate = document.getElementById(`edit-due-${workItemId}`)?.value.trim();
      const status = document.getElementById(`edit-status-${workItemId}`)?.value;

      for (const p of state.projects) {
        const t = p.tasks.find(item => item.workItemId === workItemId);
        if (t) {
          t.title = title;
          t.notes = notes;
          t.dueDate = dueDate;
          t.itemStatus = status;
          break;
        }
      }

      state.editingTaskId = null;
      renderProjects();
    }

    /* =========================================================
       EXACT SPECIFICATION HELPERS
       ========================================================= */
    function getDueAttention(value) {
      const due = parseDate(value);

      if (!due) {
        return "";
      }

      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const dueDay = new Date(
        due.getFullYear(),
        due.getMonth(),
        due.getDate()
      );

      const dayMs = 24 * 60 * 60 * 1000;

      const difference =
        Math.round((dueDay - today) / dayMs);

      if (difference < 0) {
        const days = Math.abs(difference);

        return days === 1
          ? "1 day overdue"
          : `${days} days overdue`;
      }

      if (difference === 0) {
        return "Due today";
      }

      if (difference === 1) {
        return "Due tomorrow";
      }

      return "";
    }

    function formatLifecycleStatus(value) {
      const normalized =
        String(value || "")
          .trim()
          .toLowerCase()
          .replaceAll("_", " ");

      const statuses = {
        "planned": "Planned",
        "ready": "Ready",
        "in progress": "In progress",
        "waiting": "Waiting",
        "review": "Review",
        "done": "Done"
      };

      return statuses[normalized] || value || "Ready";
    }

    function resolveOwnerText(task) {
      const label = String(task.ownerLabel || "").trim();
      if (label) return label;

      const staff = String(task.ownerStaffId || "").trim();
      if (staff === "PTR-JOSH-RAGBIR") return "Josh Ragbir";
      if (staff === "STF-HYEYOUNG") return "Hyeyoung Kim";
      if (staff === "STF-KANGHO") return "Kangho Kim";
      if (staff) return staff;

      const student = String(task.ownerStudentId || "").trim();
      if (student === "PETER-KIM") return "Peter Kim";
      if (student === "PAUL-KIM") return "Paul Kim";
      return student;
    }

    function formatCategoryEyebrow(code) {
      if (!code) return "";
      return String(code).replace(/_/g, " · ").toUpperCase();
    }

    function formatShortMonthDay(val) {
      const d = parseDate(val);
      if (!d) return val;
      return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
    }

    function formatClockTime(date) {
      if (!date) return "";
      return date.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
    }

    function parseDate(val) {
      if (!val) return null;
      const m = String(val).match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (m) {
        return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
      }
      const d = new Date(val);
      return isNaN(d.getTime()) ? null : d;
    }

    function isWaiting(task) {
      const s = String(task.itemStatus || "").toLowerCase();
      return s === "waiting" || Boolean(task.waitingOn);
    }

    // INITIALIZATION
    updateStudentButtons();
    fetchPlan();
  </script>
</body>
