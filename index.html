<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Action Plan</title>

  <!-- Exact Google Fonts Import -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Source+Sans+3:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>
    /* =========================================================
       1. EXACT DESIGN TOKENS
       ========================================================= */
    :root {
      color-scheme: dark;

      /* Typography */
      --font-display: "Newsreader", Georgia, serif;
      --font-ui: "Source Sans 3", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;

      /* Surfaces */
      --canvas: #141310;
      --surface-1: #1b1916;
      --surface-2: #211f1b;
      --surface-3: #28251f;

      /* Text */
      --text-primary: #eee9df;
      --text-secondary: #c4bdb1;
      --text-muted: #8c8579;
      --text-interactive: #aaa195;
      --text-faint: #686259;

      /* Borders */
      --border-subtle: rgba(238, 233, 223, 0.06);
      --border-default: rgba(238, 233, 223, 0.105);
      --border-strong: rgba(238, 233, 223, 0.18);

      /* Accent */
      --accent: #c39161;
      --accent-hover: #d0a071;

      /* Semantic */
      --danger: #cf776e;
      --info: #8297a4;
      --success: #829b7a;

      /* Layout */
      --content-width: 960px;

      /* Shape */
      --radius-card: 7px;
      --radius-control: 6px;

      /* Motion */
      --transition-fast: 150ms ease;
    }

    /* =========================================================
       2. RESET & BASE
       ========================================================= */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      margin: 0;

      font-family: var(--font-ui);
      font-size: 16px;
      font-weight: 400;
      line-height: 1.5;

      color: var(--text-primary);

      background:
        radial-gradient(
          circle at 18% -8%,
          rgba(195, 145, 97, 0.05),
          transparent 520px
        ),
        radial-gradient(
          circle at 88% 28%,
          rgba(255, 255, 255, 0.015),
          transparent 440px
        ),
        var(--canvas);

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* Exact noise overlay */
    body::before {
      content: "";

      position: fixed;
      inset: 0;
      z-index: 9999;

      pointer-events: none;

      opacity: 0.022;

      background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='.55'/%3E%3C/svg%3E");
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    /* =========================================================
       3. PAGE SHELL
       ========================================================= */
    .page-shell {
      width: min(calc(100% - 32px), var(--content-width));
      margin-inline: auto;

      padding-top: 24px;
      padding-bottom: 80px;
    }

    @media (min-width: 768px) {
      .page-shell {
        padding-top: 24px;
      }
    }

    /* =========================================================
       4. APPLICATION HEADER
       ========================================================= */
    .app-header {
      display: grid;
      gap: 18px;

      margin-bottom: 56px;
    }

    .app-header__top {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    @media (min-width: 640px) {
      .app-header__top {
        flex-direction: row;
        align-items: baseline;
        justify-content: space-between;
      }
    }

    .app-header__title {
      font-family: var(--font-display);
      font-size: 34px;
      font-weight: 500;
      line-height: 1.15;
      letter-spacing: -0.01em;

      color: var(--text-primary);
    }

    .app-header__context {
      font-size: 14px;
      font-weight: 400;
      line-height: 1.4;

      color: var(--text-muted);
    }

    .app-header__meta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .app-header__controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .app-header__actor-tag {
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .actor-tag-btn {
      background: none;
      border: none;
      color: var(--accent);
      cursor: pointer;
      font-family: var(--font-ui);
      font-size: 13px;
      padding: 0;
    }
    .actor-tag-btn:hover {
      text-decoration: underline;
    }

    /* =========================================================
       5. STUDENT SELECTOR CHIPS
       ========================================================= */
    .choice-chip {
      appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;

      padding: 7px 15px;

      font-family: var(--font-ui);
      font-size: 14px;
      font-weight: 500;
      line-height: 1.2;

      color: var(--text-interactive);
      background-color: var(--surface-1);

      border: 1px solid var(--border-default);
      border-radius: 9999px;

      cursor: pointer;
      user-select: none;
      text-decoration: none;

      transition:
        color var(--transition-fast),
        border-color var(--transition-fast),
        background-color var(--transition-fast);
    }

    .choice-chip:hover {
      color: var(--text-primary);
      border-color: var(--border-strong);
      background-color: var(--surface-2);
    }

    .choice-chip[aria-current="true"] {
      color: var(--text-primary);
      border-color: var(--accent);
      background-color: var(--surface-2);
    }

    .choice-chip--ghost {
      color: var(--text-muted);
      border-style: dashed;
      background-color: transparent;
    }

    .choice-chip--ghost:hover {
      color: var(--text-primary);
      border-color: var(--accent);
      background-color: var(--surface-1);
    }

    .custom-student-form {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-left: 4px;
    }

    .custom-student-input {
      background: var(--surface-2);
      border: 1px solid var(--border-default);
      border-radius: 9999px;
      padding: 6px 12px;
      color: var(--text-primary);
      font-family: var(--font-ui);
      font-size: 13px;
      outline: none;
    }
    .custom-student-input:focus {
      border-color: var(--accent);
    }

    /* =========================================================
       6. PROJECT SECTIONS
       ========================================================= */
    .projects-container {
      display: grid;
      gap: 60px;
    }

    .project {
      display: grid;
      gap: 20px;
    }

    .project-header {
      display: grid;
      gap: 6px;
    }

    .project-eyebrow {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.10em;
      text-transform: uppercase;

      color: var(--accent);
    }

    .project-title {
      font-family: var(--font-display);
      font-size: 26px;
      font-weight: 500;
      line-height: 1.25;
      letter-spacing: -0.01em;

      color: var(--text-primary);
    }

    .project-summary {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;

      font-size: 14px;
      font-weight: 400;
      line-height: 1.4;

      color: var(--text-muted);
    }

    /* =========================================================
       7. TASK LIST & TASK CARDS
       ========================================================= */
    .task-list {
      display: grid;
      gap: 10px;
    }

    .task-card {
      display: grid;
      gap: 12px;

      padding: 22px 24px;

      background-color: var(--surface-1);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-card);

      transition:
        border-color var(--transition-fast),
        background-color var(--transition-fast);
    }

    .task-card:hover {
      border-color: var(--border-strong);
      background-color: var(--surface-2);
    }

    .task-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
    }

    .task-title {
      font-family: var(--font-ui);
      font-size: 17px;
      font-weight: 600;
      line-height: 1.35;

      color: var(--text-primary);
    }

    .task-edit {
      appearance: none;
      border: 0;
      padding: 0;

      font-family: var(--font-ui);
      font-size: 13px;
      font-weight: 500;
      line-height: 1;

      color: var(--text-interactive);
      background: transparent;

      cursor: pointer;
      text-decoration: none;

      flex-shrink: 0;

      transition: color var(--transition-fast);
    }

    .task-edit:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    .task-description {
      font-size: 15px;
      font-weight: 400;
      line-height: 1.5;

      color: var(--text-secondary);
    }

    .task-footer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;

      font-size: 13px;
      font-weight: 400;
      line-height: 1.4;

      color: var(--text-muted);
    }

    .task-meta-item {
      display: inline-flex;
      align-items: center;
    }

    .task-attention {
      display: inline-flex;
      align-items: center;

      font-size: 13px;
      font-weight: 500;
      line-height: 1.4;

      color: var(--danger);
    }

    /* =========================================================
       8. IN-CARD VERTICAL EDIT MODE
       ========================================================= */
    .task-edit-form {
      display: grid;
      gap: 14px;
      width: 100%;
    }

    .edit-attribution {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: var(--text-muted);
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .edit-attribution-switch {
      background: none;
      border: none;
      color: var(--accent);
      cursor: pointer;
      font-family: var(--font-ui);
      font-size: 12px;
      padding: 0;
    }
    .edit-attribution-switch:hover {
      text-decoration: underline;
    }

    .edit-group {
      display: grid;
      gap: 6px;
    }

    .edit-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .edit-field {
      width: 100%;
      padding: 9px 12px;
      font-family: var(--font-ui);
      font-size: 14px;
      color: var(--text-primary);
      background-color: var(--surface-2);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-control);
      outline: none;
      transition: border-color var(--transition-fast);
    }

    .edit-field:focus {
      border-color: var(--accent);
    }

    .edit-field--textarea {
      resize: vertical;
      min-height: 70px;
    }

    .edit-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 480px) {
      .edit-row {
        grid-template-columns: 1fr;
      }
    }

    .edit-select {
      width: 100%;
      padding: 9px 12px;
      font-family: var(--font-ui);
      font-size: 14px;
      color: var(--text-primary);
      background-color: var(--surface-2);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-control);
      outline: none;
      cursor: pointer;
    }

    .edit-select:focus {
      border-color: var(--accent);
    }

    .edit-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
      margin-top: 6px;
    }

    .cancel-button {
      padding: 8px 16px;
      font-family: var(--font-ui);
      font-size: 14px;
      font-weight: 500;
      color: var(--text-interactive);
      background: transparent;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-control);
      cursor: pointer;
      transition: color var(--transition-fast), border-color var(--transition-fast);
    }

    .cancel-button:hover {
      color: var(--text-primary);
      border-color: var(--border-strong);
    }

    .save-button {
      padding: 8px 18px;
      font-family: var(--font-ui);
      font-size: 14px;
      font-weight: 500;
      color: #141310;
      background: var(--accent);
      border: 1px solid var(--accent);
      border-radius: var(--radius-control);
      cursor: pointer;
      transition: background-color var(--transition-fast);
    }

    .save-button:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .save-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* =========================================================
       9. PENDING REVIEW & RESOLUTION NOTICES
       ========================================================= */
    .task-pending-review {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border-subtle);
      font-size: 13px;
      color: var(--text-muted);
    }

    .task-pending-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .task-pending-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .task-pending-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
    }

    .task-pending-dot--conflict {
      background: var(--danger);
    }

    .badge-conflict {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 4px;
      background: rgba(207, 119, 110, 0.15);
      color: var(--danger);
      border: 1px solid rgba(207, 119, 110, 0.3);
      margin-left: 6px;
    }

    .task-pending-actions {
      display: inline-flex;
      gap: 12px;
      align-items: center;
    }

    .btn-link {
      background: none;
      border: none;
      color: var(--text-interactive);
      font-size: 12px;
      font-family: var(--font-ui);
      cursor: pointer;
      padding: 0;
    }
    .btn-link:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    .btn-link--danger {
      color: var(--danger);
    }
    .btn-link--danger:hover {
      color: #e08b83;
    }

    .task-pending-details {
      margin-top: 8px;
      padding: 10px 12px;
      background: var(--surface-2);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-control);
      font-size: 12px;
      line-height: 1.5;
      color: var(--text-secondary);
    }

    .task-resolution-notice {
      margin-top: 12px;
      padding: 8px 12px;
      background: rgba(130, 155, 122, 0.08);
      border: 1px solid rgba(130, 155, 122, 0.2);
      border-radius: var(--radius-control);
      font-size: 12px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .task-resolution-dismiss {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 16px;
      padding: 0 4px;
      line-height: 1;
    }
    .task-resolution-dismiss:hover {
      color: var(--text-primary);
    }

    /* =========================================================
       10. ACTOR CLAIM MODAL
       ========================================================= */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(10, 9, 8, 0.78);
      backdrop-filter: blur(4px);
      padding: 16px;
    }

    .modal-card {
      width: 100%;
      max-width: 440px;
      background: var(--surface-1);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-card);
      padding: 26px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
    }

    .modal-title {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .modal-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.4;
      margin-bottom: 20px;
    }

    .actor-choices {
      display: grid;
      gap: 8px;
      margin-bottom: 20px;
    }

    .actor-choice-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 11px 14px;
      background: var(--surface-2);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-control);
      color: var(--text-primary);
      font-family: var(--font-ui);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: border-color var(--transition-fast), background var(--transition-fast);
    }

    .actor-choice-btn:hover {
      background: var(--surface-3);
      border-color: var(--accent);
    }

    .actor-choice-role {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: capitalize;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
    }

    /* Toast Notification */
    .toast-notice {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 99999;
      padding: 12px 18px;
      background: var(--surface-2);
      border: 1px solid var(--accent);
      border-radius: var(--radius-card);
      color: var(--text-primary);
      font-size: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      animation: fadeIn 200ms ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .loading-notice {
      padding: 32px 0;
      font-size: 15px;
      color: var(--text-muted);
    }
  </style>
</head>

<body>
  <main class="page-shell">
    <!-- Application Header -->
    <header class="app-header">
      <div class="app-header__top">
        <h1 class="app-header__title">Student Action Plan</h1>
        <div id="header-context" class="app-header__context">Loading tasks…</div>
      </div>

      <div class="app-header__meta-row">
        <!-- Student Selector Chips -->
        <nav class="app-header__controls" aria-label="Student Selection">
          <button
            type="button"
            id="choice-peter"
            class="choice-chip"
            onclick="selectStudent('PETER-KIM')"
          >
            Peter Kim
          </button>
          <button
            type="button"
            id="choice-paul"
            class="choice-chip"
            onclick="selectStudent('PAUL-KIM')"
          >
            Paul Kim
          </button>
          <button
            type="button"
            id="choice-custom"
            class="choice-chip choice-chip--ghost"
            onclick="toggleCustomStudentPrompt()"
          >
            + Select student
          </button>
          <div id="custom-student-container" style="display: none;" class="custom-student-form">
            <input
              type="text"
              id="custom-student-input"
              class="custom-student-input"
              placeholder="Student ID or Name…"
              onkeydown="if(event.key==='Enter') handleCustomStudentLoad()"
            />
            <button type="button" class="choice-chip" onclick="handleCustomStudentLoad()">Load</button>
          </div>
        </nav>

        <!-- Claimed Actor Status -->
        <div id="header-actor-container" class="app-header__actor-tag" style="display: none;">
          <span>Claimed as: <strong id="header-actor-name" style="color: var(--text-primary);"></strong></span>
          <button type="button" class="actor-tag-btn" onclick="openActorModal()">(Switch)</button>
        </div>
      </div>
    </header>

    <!-- Projects and Task Lists -->
    <div id="projects-container" class="projects-container">
      <div class="loading-notice">Loading projects and tasks…</div>
    </div>
  </main>

  <!-- Actor Selection Modal -->
  <div id="actor-modal" class="modal-backdrop" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="actor-modal-title">
    <div class="modal-card">
      <h3 id="actor-modal-title" class="modal-title">Who is making this edit?</h3>
      <p class="modal-subtitle">Select your name so your edit proposal is attributed accurately in the review queue.</p>
      <div id="actor-choices" class="actor-choices">
        <!-- Dynamic list of buttons from availableActors -->
      </div>
      <div class="modal-actions">
        <button type="button" class="cancel-button" onclick="closeActorModal()">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    /* =========================================================
       CONFIG & APPLICATION STATE
       ========================================================= */
    const CONFIG = {
      scriptUrl: "https://script.google.com/macros/s/AKfycbz5RTVvD8zWqEG8RRMQXdis2jfqKDraVB-Sj_jr1g-hXoXI7H5NsDWSGs9q_pgEi0_Srw/exec"
    };

    const urlParams = new URLSearchParams(window.location.search);
    const initialStudent = urlParams.get("student") || localStorage.getItem("sap_active_student") || "PETER-KIM";

    const state = {
      currentStudent: initialStudent.trim().toUpperCase(),
      projects: [],
      rawTodos: [],
      pendingRequests: [],
      recentResolutions: [],
      availableActors: [],
      availableOwners: [],
      availableStudents: [],
      lastUpdated: null,
      editingTaskId: null,
      pendingDetailsOpen: new Set(),
      submittingTaskId: null
    };

    /* =========================================================
       ACTOR CLAIM MANAGEMENT (sessionStorage)
       ========================================================= */
    function getClaimedActor() {
      try {
        const raw = sessionStorage.getItem("sap_claimed_actor");
        return raw ? JSON.parse(raw) : null;
      } catch (e) {
        return null;
      }
    }

    function setClaimedActor(actor) {
      if (actor) {
        sessionStorage.setItem("sap_claimed_actor", JSON.stringify(actor));
      } else {
        sessionStorage.removeItem("sap_claimed_actor");
      }
      updateActorHeaderDisplay();
    }

    function updateActorHeaderDisplay() {
      const actor = getClaimedActor();
      const container = document.getElementById("header-actor-container");
      const nameEl = document.getElementById("header-actor-name");
      if (!container || !nameEl) return;

      if (actor && actor.label) {
        nameEl.textContent = actor.label;
        container.style.display = "flex";
      } else {
        container.style.display = "none";
      }
    }

    let onActorSelectedCallback = null;

    function openActorModal(onSelected) {
      onActorSelectedCallback = onSelected || null;
      const modal = document.getElementById("actor-modal");
      const choicesContainer = document.getElementById("actor-choices");
      if (!modal || !choicesContainer) return;

      choicesContainer.innerHTML = "";

      const actors = state.availableActors.length > 0 ? state.availableActors : [
        { type: "student", id: "STU-001", label: "Peter Kim" },
        { type: "student", id: "STU-002", label: "Paul Kim" },
        { type: "staff", id: "STF-HYEYOUNG", label: "Hyeyoung Kim" },
        { type: "staff", id: "STF-KANGHO", label: "Kangho Kim" },
        { type: "staff", id: "PTR-JOSH-RAGBIR", label: "Josh Ragbir" }
      ];

      actors.forEach(actor => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "actor-choice-btn";
        btn.onclick = () => {
          setClaimedActor(actor);
          closeActorModal();
          if (onActorSelectedCallback) {
            onActorSelectedCallback(actor);
            onActorSelectedCallback = null;
          }
          if (state.editingTaskId) {
            renderProjects();
          }
        };

        const nameSpan = document.createElement("span");
        nameSpan.textContent = actor.label;

        const roleSpan = document.createElement("span");
        roleSpan.className = "actor-choice-role";
        roleSpan.textContent = actor.type === "student" ? "Student" : (actor.id === "PTR-JOSH-RAGBIR" ? "Counselor" : "Parent / Staff");

        btn.append(nameSpan, roleSpan);
        choicesContainer.appendChild(btn);
      });

      modal.style.display = "flex";
    }

    function closeActorModal() {
      const modal = document.getElementById("actor-modal");
      if (modal) modal.style.display = "none";
      onActorSelectedCallback = null;
    }

    function selectStudent(studentId) {
      state.currentStudent = studentId.trim().toUpperCase();
      state.editingTaskId = null;
      localStorage.setItem("sap_active_student", state.currentStudent);

      const url = new URL(window.location.href);
      url.searchParams.set("student", state.currentStudent);
      window.history.pushState({}, "", url);

      updateStudentButtons();
      fetchPlan();
    }

    function updateStudentButtons() {
      const isPeter = state.currentStudent === "PETER-KIM";
      const isPaul = state.currentStudent === "PAUL-KIM";

      const peterBtn = document.getElementById("choice-peter");
      const paulBtn = document.getElementById("choice-paul");

      if (peterBtn) peterBtn.setAttribute("aria-current", isPeter ? "true" : "false");
      if (paulBtn) paulBtn.setAttribute("aria-current", isPaul ? "true" : "false");

    function toggleCustomStudentPrompt() {
      const container = document.getElementById("custom-student-container");
      if (!container) return;
      const isOpen = container.style.display !== "none";
      container.style.display = isOpen ? "none" : "inline-flex";
      if (!isOpen) {
        document.getElementById("custom-student-input")?.focus();
      }
    }

    function handleCustomStudentLoad() {
      const input = document.getElementById("custom-student-input");
      const val = input?.value.trim();
      if (val) {
        selectStudent(val);
        input.value = "";
        toggleCustomStudentPrompt();
      }

    /* =========================================================
       DATA FETCHING & NORMALIZATION
       ========================================================= */
    async function fetchPlan() {
      const container = document.getElementById("projects-container");
      if (!container) return;
      
      // Keep existing project view while refreshing if already loaded
      if (state.projects.length === 0) {
        container.innerHTML = `<div class="loading-notice">Loading projects and tasks…</div>`;
      }

      try {
        const url = `${CONFIG.scriptUrl}?student=${encodeURIComponent(state.currentStudent)}&_t=${Date.now()}`;
        const res = await fetch(url, { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const data = await res.json();
        state.lastUpdated = data.lastUpdated ? new Date(data.lastUpdated) : new Date();
        state.pendingRequests = Array.isArray(data.pendingRequests) ? data.pendingRequests : [];
        state.recentResolutions = Array.isArray(data.recentResolutions) ? data.recentResolutions : [];
        state.availableActors = Array.isArray(data.availableActors) ? data.availableActors : [];
        state.availableOwners = Array.isArray(data.availableOwners) ? data.availableOwners : [];
        state.availableStudents = Array.isArray(data.availableStudents) ? data.availableStudents : [];

        parseProjects(data);
        updateHeaderContext();
        updateActorHeaderDisplay();
        renderProjects();

      } catch (err) {
        console.error("Fetch error:", err);
        if (state.projects.length === 0) {
          container.innerHTML = `<div class="loading-notice">Unable to load data. Please check connection and refresh.</div>`;
        }
      }
    }

    function parseProjects(data) {
      let projectList = [];

      if (data.actionBrief && Array.isArray(data.actionBrief.projects)) {
        projectList = data.actionBrief.projects.map(p => {
          const tasks = [
            ...(p.roles?.student || []),
            ...(p.roles?.parent || []),
            ...(p.roles?.me || [])
          ];
          return {
            projectId: p.projectId,
            projectName: p.projectName,
            categoryCode: p.categoryCode || "",
            projectStatus: p.projectStatus || "active",
            targetDate: p.targetDate || "",
            notes: p.notes || "",
            tasks: tasks
          };
        });
      } else {
        const allTodos = Array.isArray(data.todos) ? data.todos : [];
        const map = new Map();
        allTodos.forEach(t => {
          const pId = t.projectId || "PRJ-GENERAL";
          if (!map.has(pId)) {
            map.set(pId, {
              projectId: pId,
              projectName: t.projectName || "General",
              categoryCode: "",
              projectStatus: "active",
              targetDate: "",
              notes: "",
              tasks: []
            });
          }
          map.get(pId).tasks.push(t);
        });
        projectList = Array.from(map.values());
      }

      state.projects = projectList.filter(p => p.tasks.length > 0);
    }

    function updateHeaderContext() {
      const totalOpenTasks = state.projects.reduce((acc, p) => acc + p.tasks.length, 0);
      const timeString = formatClockTime(state.lastUpdated);
      const headerContext = document.getElementById("header-context");
      if (headerContext) {
        headerContext.textContent = `${totalOpenTasks} open task${totalOpenTasks === 1 ? "" : "s"} · Updated ${timeString}`;
      }
    }

    /* =========================================================
       PROJECT & CARD RENDERING
       ========================================================= */
    function renderProjects() {
      const container = document.getElementById("projects-container");
      if (!container) return;

      if (state.projects.length === 0) {
        container.innerHTML = `<div class="loading-notice">No active projects or tasks.</div>`;
        return;
      }

      container.innerHTML = "";

      state.projects.forEach(project => {
        const projectEl = document.createElement("section");
        projectEl.className = "project";

        // Header
        const header = document.createElement("header");
        header.className = "project-header";

        // Eyebrow
        const eyebrowText = formatCategoryEyebrow(project.categoryCode);
        if (eyebrowText) {
          const eyebrow = document.createElement("div");
          eyebrow.className = "project-eyebrow";
          eyebrow.textContent = eyebrowText;
          header.appendChild(eyebrow);
        }

        // Title
        const title = document.createElement("h2");
        title.className = "project-title";
        title.textContent = project.projectName;
        header.appendChild(title);

        // Summary
        const summary = document.createElement("div");
        summary.className = "project-summary";

        const parts = [];
        if (project.targetDate) {
          parts.push(`Target ${formatShortMonthDay(project.targetDate)}`);
        }
        parts.push(`${project.tasks.length} open task${project.tasks.length === 1 ? "" : "s"}`);

        const waitingCount = project.tasks.filter(t => isWaiting(t)).length;
        if (waitingCount > 0) {
          parts.push(`${waitingCount} waiting`);
        }

        parts.forEach((txt, idx) => {
          if (idx > 0) {
            const sep = document.createElement("span");
            sep.setAttribute("aria-hidden", "true");
            sep.textContent = "·";
            summary.appendChild(sep);
          }
          const item = document.createElement("span");
          item.textContent = txt;
          summary.appendChild(item);
        });

        header.appendChild(summary);
        projectEl.appendChild(header);

        // Task List
        const taskList = document.createElement("div");
        taskList.className = "task-list";

        project.tasks.forEach(task => {
          taskList.appendChild(renderTaskCard(task, project.projectId));
        });

        projectEl.appendChild(taskList);
        container.appendChild(projectEl);
      });
    }

    function renderTaskCard(task, projectId) {
      const card = document.createElement("article");
      card.className = "task-card";

      const isEditing = state.editingTaskId === task.workItemId;

      if (isEditing) {
        return renderTaskEditForm(task, projectId, card);
      }

      // Normal Card View
      const taskHeader = document.createElement("header");
      taskHeader.className = "task-header";

      const title = document.createElement("h3");
      title.className = "task-title";
      title.textContent = task.title;

      const editBtn = document.createElement("button");
      editBtn.className = "task-edit";
      editBtn.type = "button";
      editBtn.textContent = "Edit";
      editBtn.onclick = () => handleEditClick(task.workItemId);

      taskHeader.append(title, editBtn);
      card.appendChild(taskHeader);

      if (task.notes) {
        const desc = document.createElement("p");
        desc.className = "task-description";
        desc.textContent = task.notes;
        card.appendChild(desc);
      }

      // Footer
      const footer = document.createElement("footer");
      footer.className = "task-footer";

      // 1. Due Date
      if (task.dueDate) {
        const dueMeta = document.createElement("span");
        dueMeta.className = "task-meta-item";
        dueMeta.textContent = `Due ${formatShortMonthDay(task.dueDate)}`;
        footer.appendChild(dueMeta);
      }

      // 2. Lifecycle Status
      const statusMeta = document.createElement("span");
      statusMeta.className = "task-meta-item";
      statusMeta.textContent = formatLifecycleStatus(task.itemStatus);
      footer.appendChild(statusMeta);

      // 3. Owner
      const ownerName = resolveOwnerText(task);
      if (ownerName) {
        const ownerMeta = document.createElement("span");
        ownerMeta.className = "task-meta-item";
        ownerMeta.textContent = ownerName;
        footer.appendChild(ownerMeta);
      }

      // 4. Overdue / Due Attention
      const attentionText = getDueAttention(task.dueDate);
      if (attentionText) {
        const attention = document.createElement("span");
        attention.className = "task-attention";
        attention.textContent = attentionText;
        footer.appendChild(attention);
      }

      card.appendChild(footer);

      // 5. Attached Pending Review Proposal
      const pendingReview = state.pendingRequests.find(r => r.workItemId === task.workItemId);
      if (pendingReview) {
        card.appendChild(renderPendingReviewSection(task, pendingReview));
      }

      // 6. Attached Recent Resolution Notice (if not dismissed)
      const dismissedIds = getDismissedResolutionIds();
      const resolution = state.recentResolutions.find(r => r.workItemId === task.workItemId && !dismissedIds.has(r.reviewId));
      if (resolution && !pendingReview) {
        card.appendChild(renderResolutionNotice(task, resolution));
      }

      return card;
    }

    function renderPendingReviewSection(task, review) {
      const section = document.createElement("div");
      section.className = "task-pending-review";

      const header = document.createElement("div");
      header.className = "task-pending-header";

      const isConflict = review.status === "CONFLICT";
      const actorLabel = review.actor ? review.actor.label : "User";
      const timeAgo = formatTimeAgo(review.createdAt);

      const label = document.createElement("div");
      label.className = "task-pending-label";

      const dot = document.createElement("span");
      dot.className = isConflict ? "task-pending-dot task-pending-dot--conflict" : "task-pending-dot";

      const text = document.createElement("span");
      text.textContent = `Awaiting review · Proposed by ${actorLabel} (${timeAgo})`;

      label.append(dot, text);

      if (isConflict) {
        const badge = document.createElement("span");
        badge.className = "badge-conflict";
        badge.textContent = "Version Conflict";
        label.appendChild(badge);
      }

      const actions = document.createElement("div");
      actions.className = "task-pending-actions";

      const isDetailsOpen = state.pendingDetailsOpen.has(review.reviewId);
      const viewBtn = document.createElement("button");
      viewBtn.type = "button";
      viewBtn.className = "btn-link";
      viewBtn.textContent = isDetailsOpen ? "Hide details" : "View proposal";
      viewBtn.onclick = () => {
        if (state.pendingDetailsOpen.has(review.reviewId)) {
          state.pendingDetailsOpen.delete(review.reviewId);
        } else {
          state.pendingDetailsOpen.add(review.reviewId);
        }
        renderProjects();
      };

      const withdrawBtn = document.createElement("button");
      withdrawBtn.type = "button";
      withdrawBtn.className = "btn-link btn-link--danger";
      withdrawBtn.textContent = "Withdraw";
      withdrawBtn.onclick = () => handleWithdrawProposal(review);

      actions.append(viewBtn, withdrawBtn);
      header.append(label, actions);
      section.appendChild(header);

      if (isDetailsOpen) {
        const details = document.createElement("div");
        details.className = "task-pending-details";

        const changes = review.changes || {};
        const changeLines = [];
        if (changes.title) changeLines.push(`• Title: "${escapeHtml(changes.title)}"`);
        if (changes.notes) changeLines.push(`• Description: "${escapeHtml(changes.notes)}"`);
        if (changes.dueDate) changeLines.push(`• Due date: ${changes.dueDate}`);
        if (changes.itemStatus) changeLines.push(`• Status: ${formatLifecycleStatus(changes.itemStatus)}`);
        if (changes.owner) {
          const ownerLabel = typeof changes.owner === "object" ? changes.owner.label : changes.owner;
          changeLines.push(`• Owner: ${escapeHtml(ownerLabel)}`);
        }

        if (changeLines.length === 0 && review.reason) {
          changeLines.push(`• Reason: ${escapeHtml(review.reason)}`);
        }

        details.innerHTML = `<strong>Proposed changes:</strong><br>${changeLines.join("<br>")}`;
        section.appendChild(details);
      }

      return section;
    }

    function renderResolutionNotice(task, res) {
      const notice = document.createElement("div");
      notice.className = "task-resolution-notice";

      const text = document.createElement("span");
      const statusText = res.status === "APPLIED" ? "applied" : (res.status === "DISMISSED" ? "withdrawn" : res.status.toLowerCase());
      const byText = res.resolvedBy ? ` by ${res.resolvedBy}` : "";
      text.textContent = `Proposal ${statusText}${byText} · ${res.resolution || "Review complete"}`;

      const dismissBtn = document.createElement("button");
      dismissBtn.type = "button";
      dismissBtn.className = "task-resolution-dismiss";
      dismissBtn.setAttribute("aria-label", "Dismiss notification");
      dismissBtn.innerHTML = "&times;";
      dismissBtn.onclick = () => dismissResolution(res.reviewId);

      notice.append(text, dismissBtn);
      return notice;
    }

    /* =========================================================
       SUBMISSION & PROPOSAL HANDLERS
       ========================================================= */
    function handleEditClick(workItemId) {
      const actor = getClaimedActor();
      if (!actor) {
        openActorModal((claimed) => {
          state.editingTaskId = workItemId;
          renderProjects();
        });
      } else {
        state.editingTaskId = workItemId;
        renderProjects();
      }
    }

    async function handleSubmitProposal(e, task) {
      e.preventDefault();
      const actor = getClaimedActor();
      if (!actor) {
        openActorModal(() => handleSubmitProposal(e, task));
        return;
      }

      const workItemId = task.workItemId;
      const newTitle = document.getElementById(`edit-title-${workItemId}`)?.value.trim();
      const newNotes = document.getElementById(`edit-desc-${workItemId}`)?.value.trim();
      const newDueDate = document.getElementById(`edit-due-${workItemId}`)?.value.trim();
      const newStatus = document.getElementById(`edit-status-${workItemId}`)?.value;
      const newOwnerVal = document.getElementById(`edit-owner-${workItemId}`)?.value;

      // Compute Delta
      const changes = {};
      if (newTitle !== undefined && newTitle !== (task.title || "")) {
        changes.title = newTitle;
      }
      if (newNotes !== undefined && newNotes !== (task.notes || "")) {
        changes.notes = newNotes;
      }
      if (newDueDate !== undefined && newDueDate !== (task.dueDate || "")) {
        changes.dueDate = newDueDate;
      }
      const curStatus = String(task.itemStatus || "").toLowerCase();
      if (newStatus !== undefined && newStatus !== curStatus) {
        changes.itemStatus = newStatus;
      }
      const curOwnerVal = getCurrentOwnerValue(task);
      if (newOwnerVal !== undefined && newOwnerVal.toLowerCase() !== curOwnerVal.toLowerCase()) {
        changes.owner = newOwnerVal;
      }

      if (Object.keys(changes).length === 0) {
        showToast("No changes were made to submit.");
        state.editingTaskId = null;
        renderProjects();
        return;
      }

      state.submittingTaskId = workItemId;
      renderProjects();

      const payload = {
        action: "CREATE_REVIEW_REQUEST",
        studentId: state.currentStudent,
        workItemId: workItemId,
        actor: actor,
        changes: changes,
        baseUpdatedAt: task.updatedAt || "",
        reason: "Proposed update via Student Action Plan web dashboard"
      };

      try {
        const res = await fetch(CONFIG.scriptUrl, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload),
          redirect: "follow"
        });

        const result = await res.json();
        if (result && result.success) {
          showToast(result.message || "Proposal submitted for review.");
          state.editingTaskId = null;
          state.submittingTaskId = null;
          await fetchPlan();
        } else {
          throw new Error(result.message || "Failed to submit change proposal");
        }
      } catch (err) {
        console.error("Submission error:", err);
        showToast("Error submitting proposal: " + err.message);
        state.submittingTaskId = null;
        renderProjects();
      }
    }

    async function handleWithdrawProposal(review) {
      if (!confirm("Are you sure you want to withdraw this change proposal?")) return;

      const actor = getClaimedActor() || { type: "student", id: state.currentStudent, label: "User" };
      const payload = {
        action: "CANCEL_REVIEW_REQUEST",
        reviewId: review.reviewId,
        actor: actor
      };

      try {
        const res = await fetch(CONFIG.scriptUrl, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload),
          redirect: "follow"
        });

        const result = await res.json();
        if (result && result.success) {
          showToast("Proposal withdrawn.");
          await fetchPlan();
        } else {
          throw new Error(result.message || "Failed to withdraw proposal");
        }
      } catch (err) {
        console.error("Withdraw error:", err);
        showToast("Error withdrawing proposal: " + err.message);
      }
    }

    /* =========================================================
       LOCAL STORAGE HELPERS (Dismissed notices)
       ========================================================= */
    function getDismissedResolutionIds() {
      try {
        const raw = localStorage.getItem("sap_dismissed_resolutions");
        const arr = raw ? JSON.parse(raw) : [];
        return new Set(Array.isArray(arr) ? arr : []);
      } catch (e) {
        return new Set();
      }
    }

    function dismissResolution(reviewId) {
      const dismissed = getDismissedResolutionIds();
      dismissed.add(reviewId);
      localStorage.setItem("sap_dismissed_resolutions", JSON.stringify(Array.from(dismissed)));
      renderProjects();
    }

    function showToast(msg) {
      const existing = document.querySelector(".toast-notice");
      if (existing) existing.remove();

      const toast = document.createElement("div");
      toast.className = "toast-notice";
      toast.textContent = msg;
      document.body.appendChild(toast);

      setTimeout(() => {
        toast.remove();
      }, 4000);
    }

    /* =========================================================
       SPECIFICATION HELPERS
       ========================================================= */
    function getCurrentOwnerValue(task) {
      if (task.ownerStudentId) return "student:" + task.ownerStudentId;
      if (task.ownerStaffId) return "staff:" + task.ownerStaffId;
      if (task.ownerLabel) return "label:" + task.ownerLabel;
      return "student:" + state.currentStudent;
    }

    function resolveOwnerText(task) {
      const label = String(task.ownerLabel || "").trim();
      if (label) return label;

      const staff = String(task.ownerStaffId || "").trim();
      if (staff === "PTR-JOSH-RAGBIR") return "Josh Ragbir";
      if (staff === "STF-HYEYOUNG") return "Hyeyoung Kim";
      if (staff === "STF-KANGHO") return "Kangho Kim";
      if (staff) return staff;

      const student = String(task.ownerStudentId || "").trim();
      if (student === "PETER-KIM" || student === "STU-001") return "Peter Kim";
      if (student === "PAUL-KIM" || student === "STU-002") return "Paul Kim";
      return student;
    }

    function getDueAttention(value) {
      const due = parseDate(value);
      if (!due) return "";

      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const dueDay = new Date(due.getFullYear(), due.getMonth(), due.getDate());
      const dayMs = 24 * 60 * 60 * 1000;
      const difference = Math.round((dueDay - today) / dayMs);

      if (difference < 0) {
        const days = Math.abs(difference);
        return days === 1 ? "1 day overdue" : `${days} days overdue`;
      }
      if (difference === 0) return "Due today";
      if (difference === 1) return "Due tomorrow";
      return "";
    }

    function formatLifecycleStatus(value) {
      const normalized = String(value || "").trim().toLowerCase().replaceAll("_", " ");
      const statuses = {
        "planned": "Planned",
        "ready": "Ready",
        "in progress": "In progress",
        "waiting": "Waiting",
        "review": "Review",
        "done": "Done"
      };
      return statuses[normalized] || value || "Ready";
    }

    function formatCategoryEyebrow(code) {
      if (!code) return "";
      return String(code).replace(/_/g, " · ").toUpperCase();
    }

    function formatShortMonthDay(val) {
      const d = parseDate(val);
      if (!d) return val;
      return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
    }

    function formatClockTime(date) {
      if (!date) return "";
      return date.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
    }

    function formatTimeAgo(dateStr) {
      if (!dateStr) return "recently";
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return "recently";
      const sec = Math.round((Date.now() - d.getTime()) / 1000);
      if (sec < 60) return "just now";
      const min = Math.round(sec / 60);
      if (min < 60) return `${min}m ago`;
      const hrs = Math.round(min / 60);
      if (hrs < 24) return `${hrs}h ago`;
      const days = Math.round(hrs / 24);
      return `${days}d ago`;
    }

    function parseDate(val) {
      if (!val) return null;
      const m = String(val).match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (m) return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
      const d = new Date(val);
      return isNaN(d.getTime()) ? null : d;
    }

    function isWaiting(task) {
      const s = String(task.itemStatus || "").toLowerCase();
      return s === "waiting" || Boolean(task.waitingOn);
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // INITIALIZATION
    updateStudentButtons();
    updateActorHeaderDisplay();
    fetchPlan();
  </script>
</body>
