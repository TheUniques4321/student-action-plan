<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Student Action Plan — Operational Coaching Brief">
  <title>Student Action Plan</title>

  <!-- Google Fonts: Newsreader 500/600 & Source Sans 3 400/500/600 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Source+Sans+3:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>
    /* =========================================================
       FINAL DESIGN TOKENS — DO NOT SUBSTITUTE VALUES
       ========================================================= */
    :root {
      /* Fonts */
      --font-display: "Newsreader", Georgia, serif;
      --font-ui: "Source Sans 3", system-ui, sans-serif;

      /* Warm graphite palette */
      --canvas:       #141310;
      --surface:      #1b1916;
      --surface-2:    #211f1b;
      --surface-3:    #28251f;

      --text:         #eee9df;
      --text-soft:    #c4bdb1;
      --text-muted:   #8c8579;
      --text-faint:   #686259;

      --border:       rgba(238, 233, 223, 0.105);
      --border-soft:  rgba(238, 233, 223, 0.060);
      --border-focus: rgba(195, 145, 97, 0.65);

      /* One principal accent */
      --accent:       #c39161;
      --accent-hover: #d0a071;

      /* Semantic colors — intentionally muted */
      --danger:       #c9786f;
      --warning:      #c69a5b;
      --info:         #8198a5;
      --success:      #829b7a;

      /* Typography */
      --fs-11: 0.6875rem;
      --fs-12: 0.75rem;
      --fs-13: 0.8125rem;
      --fs-14: 0.875rem;
      --fs-16: 1rem;
      --fs-17: 1.0625rem;
      --fs-20: 1.25rem;
      --fs-project: clamp(1.625rem, 1.48rem + 0.65vw, 2rem);

      /* Spacing */
      --s1: 0.25rem;   /* 4 */
      --s2: 0.5rem;    /* 8 */
      --s3: 0.75rem;   /* 12 */
      --s4: 1rem;      /* 16 */
      --s5: 1.5rem;    /* 24 */
      --s6: 2rem;      /* 32 */
      --s7: 3rem;      /* 48 */
      --s8: 4rem;      /* 64 */

      /* Shape */
      --radius-input: 6px;
      --radius-card: 7px;

      /* Layout */
      --content-width: 48rem;
      --reading-width: 66ch;
    }

    /* =========================================================
       RESET & BASE TEXTURE
       ========================================================= */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      color-scheme: dark;
      background-color: var(--canvas);
    }

    body {
      font-family: var(--font-ui);
      font-size: var(--fs-16);
      font-weight: 400;
      line-height: 1.5;
      color: var(--text);
      min-block-size: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background:
        radial-gradient(
          circle at 15% -10%,
          rgba(180, 138, 94, 0.055),
          transparent 34rem
        ),
        radial-gradient(
          circle at 85% 20%,
          rgba(255, 255, 255, 0.018),
          transparent 26rem
        ),
        var(--canvas);
    }

    /* Exact noise overlay */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none;
      opacity: 0.024;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E");
    }

    /* =========================================================
       EXACT TYPOGRAPHY UTILITIES
       ========================================================= */
    .app-title {
      font-family: var(--font-display);
      font-size: var(--fs-20);
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: -0.015em;
    }

    .project-title {
      max-inline-size: 24ch;
      font-family: var(--font-display);
      font-size: var(--fs-project);
      font-weight: 600;
      line-height: 1.08;
      letter-spacing: -0.018em;
      text-wrap: balance;
    }

    .task-title {
      max-inline-size: var(--reading-width);
      font-family: var(--font-ui);
      font-size: var(--fs-17);
      font-weight: 600;
      line-height: 1.38;
      letter-spacing: -0.006em;
    }

    .task-description {
      max-inline-size: var(--reading-width);
      font-size: var(--fs-14);
      line-height: 1.5;
      color: var(--text-soft);
    }

    .meta {
      font-size: var(--fs-13);
      line-height: 1.35;
      color: var(--text-muted);
    }

    .eyebrow {
      font-size: var(--fs-11);
      font-weight: 600;
      line-height: 1;
      letter-spacing: 0.085em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    /* =========================================================
       EXACT PAGE COMPOSITION
       ========================================================= */
    .page {
      inline-size: min(calc(100% - 2rem), var(--content-width));
      margin-inline: auto;
      padding-block: var(--s5) var(--s8);
    }

    @media (min-width: 48rem) {
      .page {
        padding-block-start: var(--s7);
      }
    }

    /* Header */
    .page-header {
      display: grid;
      gap: var(--s3);
      margin-block-end: var(--s7);
    }

    .header-top {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: var(--s2) var(--s4);
    }

    .header-nav {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--s2);
    }

    .student-btn {
      padding: 0.35rem 0.65rem;
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-input);
      font-family: var(--font-ui);
      font-size: var(--fs-13);
      font-weight: 500;
      color: var(--text-soft);
      background: var(--surface);
      cursor: pointer;
      transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease;
    }

    .student-btn:hover {
      color: var(--text);
      border-color: var(--border);
      background: var(--surface-2);
    }

    .student-btn.active {
      color: var(--text);
      border-color: var(--accent);
      background: var(--surface-3);
      font-weight: 600;
    }

    .change-student-link {
      margin-inline-start: var(--s2);
      font-size: var(--fs-13);
      color: var(--text-faint);
      background: transparent;
      border: 0;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .change-student-link:hover {
      color: var(--text-soft);
    }

    /* Custom student inline prompt */
    .custom-student-form {
      display: inline-flex;
      align-items: center;
      gap: var(--s2);
      margin-inline-start: var(--s2);
    }

    .custom-student-form input {
      font-family: var(--font-ui);
      font-size: var(--fs-13);
      padding: 0.25rem 0.5rem;
      background: var(--canvas);
      border: 1px solid var(--border);
      border-radius: var(--radius-input);
      color: var(--text);
      inline-size: 8rem;
    }

    .custom-student-form button {
      font-family: var(--font-ui);
      font-size: var(--fs-12);
      font-weight: 600;
      padding: 0.25rem 0.5rem;
      background: var(--surface-3);
      border: 1px solid var(--border);
      border-radius: var(--radius-input);
      color: var(--text);
      cursor: pointer;
    }

    /* =========================================================
       EXACT PROJECT CONSTRUCTION
       ========================================================= */
    .project {
      padding-block-start: var(--s7);
      border-block-start: 1px solid var(--border-soft);
    }

    .project:first-child {
      padding-block-start: 0;
      border-block-start: 0;
    }

    .project + .project {
      margin-block-start: var(--s8);
    }

    .project-header {
      display: grid;
      gap: var(--s2);
      margin-block-end: var(--s5);
    }

    .project-summary {
      display: flex;
      flex-wrap: wrap;
      gap: var(--s2) var(--s4);
      font-size: var(--fs-13);
      color: var(--text-muted);
    }

    @media (min-width: 48rem) {
      .project-header {
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: end;
      }
      .project-summary {
        justify-content: flex-end;
      }
    }

    /* =========================================================
       EXACT TASK CARD
       ========================================================= */
    .task-list {
      display: grid;
      gap: var(--s3);
    }

    .task-card {
      position: relative;
      display: grid;
      gap: var(--s3);
      padding: var(--s4);
      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,.016),
          rgba(255,255,255,0)
        ),
        var(--surface);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-card);
      transition:
        background-color 150ms ease,
        border-color 150ms ease;
    }

    .task-card:hover,
    .task-card:focus-within {
      background-color: var(--surface-2);
      border-color: var(--border);
    }

    @media (min-width: 48rem) {
      .task-card {
        padding: var(--s5);
      }
    }

    .task-main {
      display: grid;
      gap: var(--s2);
    }

    .task-footer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: var(--s2) var(--s4);
      padding-block-start: var(--s1);
    }

    .task-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--s2) var(--s4);
      font-size: var(--fs-13);
      color: var(--text-muted);
    }

    .task-edit {
      padding: 0;
      border: 0;
      font: inherit;
      font-size: var(--fs-13);
      font-weight: 500;
      color: var(--text-faint);
      background: transparent;
      cursor: pointer;
      transition: color 120ms ease;
    }

    .task-edit:hover,
    .task-edit:focus-visible {
      color: var(--text);
    }

    /* Exact status treatment */
    .task-status {
      color: var(--text-muted);
    }

    .task-status[data-status="waiting"] {
      color: var(--info);
    }

    .task-status[data-status="done"],
    .task-status[data-status="complete"] {
      color: var(--success);
    }

    /* Exceptional attention states */
    .attention {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: var(--fs-12);
      font-weight: 600;
      color: var(--danger);
    }

    .attention::before {
      content: "";
      inline-size: 5px;
      block-size: 5px;
      border-radius: 50%;
      background: currentColor;
    }

    /* Blocker callout inline */
    .blocker-note {
      color: var(--info);
      font-size: var(--fs-13);
      font-style: italic;
    }

    /* =========================================================
       EXACT EDITING CONTROLS
       ========================================================= */
    .task-edit-form {
      display: grid;
      gap: var(--s3);
    }

    .edit-field,
    .edit-select {
      inline-size: 100%;
      min-block-size: 42px;
      padding: 0.65rem 0.75rem;
      font-family: var(--font-ui);
      font-size: var(--fs-16);
      line-height: 1.4;
      color: var(--text);
      background: var(--canvas);
      border: 1px solid var(--border);
      border-radius: var(--radius-input);
      outline: none;
    }

    .edit-field:focus,
    .edit-select:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(195, 145, 97, 0.11);
    }

    .edit-grid-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--s3);
    }

    .edit-field-group {
      display: grid;
      gap: var(--s1);
    }

    .edit-field-label {
      font-size: var(--fs-12);
      font-weight: 500;
      color: var(--text-muted);
    }

    .edit-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: var(--s2);
      padding-block-start: var(--s1);
    }

    .save-button {
      min-block-size: 40px;
      padding-inline: var(--s4);
      border: 1px solid var(--accent);
      border-radius: var(--radius-input);
      font-family: var(--font-ui);
      font-size: var(--fs-14);
      font-weight: 600;
      color: #17130f;
      background: var(--accent);
      cursor: pointer;
      transition: background-color 120ms ease;
    }

    .save-button:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    .cancel-button {
      min-block-size: 40px;
      padding-inline: var(--s3);
      border: 0;
      font-family: var(--font-ui);
      font-size: var(--fs-14);
      color: var(--text-muted);
      background: transparent;
      cursor: pointer;
    }

    .cancel-button:hover {
      color: var(--text);
    }

    /* Status & Loading feedback */
    .status-feedback {
      font-size: var(--fs-13);
      color: var(--text-muted);
      padding-block: var(--s4);
      font-style: italic;
    }
  </style>
</head>

<body>
  <div class="page">

    <!-- TOP HEADER -->
    <header class="page-header">
      <div class="header-top">
        <h1 class="app-title">Student Action Plan</h1>
        <div class="meta" id="header-student-meta">Loading…</div>
      </div>

      <nav class="header-nav" aria-label="Student selection">
        <button type="button" class="student-btn active" id="btn-peter" onclick="selectStudent('PETER-KIM')">Peter Kim</button>
        <button type="button" class="student-btn" id="btn-paul" onclick="selectStudent('PAUL-KIM')">Paul Kim</button>
        <button type="button" class="change-student-link" onclick="toggleCustomStudent()">Change student</button>
        <form id="custom-student-form" class="custom-student-form" style="display: none;" onsubmit="handleCustomStudentSubmit(event)">
          <input type="text" id="custom-student-input" placeholder="Student ID…">
          <button type="submit">Load</button>
        </form>
      </nav>
    </header>

    <!-- MAIN PROJECTS CONTAINER -->
    <main id="projects-container">
      <div class="status-feedback">Loading projects and tasks…</div>
    </main>

  </div>

  <!-- JAVASCRIPT ENGINE -->
  <script>
    "use strict";

    const CONFIG = {
      scriptUrl: "https://script.google.com/macros/s/AKfycbzivDKDfsgEKyza4GHL8D-NmkgcdKKn0zuT1kxeR6ZDxDGOz8X069Kpg9lnPfgpNrfmIw/exec",
      defaultStudent: "PETER-KIM"
    };

    const state = {
      currentStudent: getInitialStudent(),
      projects: [],
      editingTaskId: null
    };

    function getInitialStudent() {
      const p = new URLSearchParams(window.location.search).get("student");
      return (p ? p.trim().toUpperCase() : "") || localStorage.getItem("sap_student_id") || CONFIG.defaultStudent;
    }

    function selectStudent(studentId) {
      if (!studentId) return;
      state.currentStudent = studentId.trim().toUpperCase();
      localStorage.setItem("sap_student_id", state.currentStudent);

      const url = new URL(window.location.href);
      url.searchParams.set("student", state.currentStudent);
      window.history.pushState({}, "", url);

      updateHeaderNav();
      fetchDashboard();
    }

    function updateHeaderNav() {
      document.getElementById("btn-peter")?.classList.toggle("active", state.currentStudent === "PETER-KIM");
      document.getElementById("btn-paul")?.classList.toggle("active", state.currentStudent === "PAUL-KIM");
    }

    function toggleCustomStudent() {
      const form = document.getElementById("custom-student-form");
      if (form) {
        form.style.display = form.style.display === "none" ? "inline-flex" : "none";
        if (form.style.display !== "none") {
          document.getElementById("custom-student-input")?.focus();
        }
      }
    }

    function handleCustomStudentSubmit(e) {
      e.preventDefault();
      const val = document.getElementById("custom-student-input").value.trim();
      if (val) {
        selectStudent(val);
        toggleCustomStudent();
      }
    }

    async function fetchDashboard() {
      const container = document.getElementById("projects-container");
      container.innerHTML = `<div class="status-feedback">Loading projects and tasks…</div>`;

      try {
        const url = `${CONFIG.scriptUrl}?student=${encodeURIComponent(state.currentStudent)}&_t=${Date.now()}`;
        const res = await fetch(url, { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const data = await res.json();
        processData(data);
        render();

      } catch (err) {
        console.error("Dashboard error:", err);
        container.innerHTML = `<div class="status-feedback">Unable to load projects. Please refresh or check connection.</div>`;
      }
    }

    function processData(data) {
      // Group projects with tasks
      const allTodos = Array.isArray(data.todos) ? data.todos : [];
      let projectsList = [];

      if (data.actionBrief && Array.isArray(data.actionBrief.projects)) {
        projectsList = data.actionBrief.projects.map(p => {
          const tasks = [
            ...(p.roles?.student || []),
            ...(p.roles?.parent || []),
            ...(p.roles?.me || [])
          ];
          return {
            projectId: p.projectId,
            projectName: p.projectName,
            categoryCode: p.categoryCode || "",
            projectStatus: p.projectStatus || "active",
            targetDate: p.targetDate || "",
            notes: p.notes || "",
            tasks: tasks
          };
        });
      } else {
        // Fallback reconstruction from flat todos
        const map = new Map();
        allTodos.forEach(t => {
          const pId = t.projectId || "PRJ-DEFAULT";
          if (!map.has(pId)) {
            map.set(pId, {
              projectId: pId,
              projectName: t.projectName || "General Project",
              categoryCode: "",
              projectStatus: "active",
              targetDate: "",
              notes: "",
              tasks: []
            });
          }
          map.get(pId).tasks.push(t);
        });
        projectsList = Array.from(map.values());
      }

      // Filter out empty projects and sort
      state.projects = projectsList.filter(p => p.tasks.length > 0);

      // Update header meta
      const totalTasks = state.projects.reduce((acc, p) => acc + p.tasks.length, 0);
      const studentName = state.currentStudent === "PETER-KIM" ? "Peter Kim" : (state.currentStudent === "PAUL-KIM" ? "Paul Kim" : state.currentStudent);
      document.getElementById("header-student-meta").textContent = `${studentName} · ${totalTasks} open task${totalTasks === 1 ? "" : "s"}`;
    }

    function render() {
      const container = document.getElementById("projects-container");

      if (state.projects.length === 0) {
        container.innerHTML = `<div class="status-feedback">No active projects or tasks for this student.</div>`;
        return;
      }

      container.innerHTML = state.projects.map(project => renderProject(project)).join("");
    }

    function renderProject(p) {
      const category = formatCategory(p.categoryCode);
      const totalTasks = p.tasks.length;
      const waitingCount = p.tasks.filter(t => isWaiting(t)).length;
      const targetStr = p.targetDate ? `Target ${formatTargetDate(p.targetDate)}` : "";

      return `
        <section class="project" id="project-${escapeHtml(p.projectId)}">
          <header class="project-header">
            <div>
              ${category ? `<div class="eyebrow">${escapeHtml(category)}</div>` : ""}
              <h2 class="project-title">${escapeHtml(p.projectName)}</h2>
            </div>
            <div class="project-summary">
              ${targetStr ? `<span>${escapeHtml(targetStr)}</span>` : ""}
              <span>${totalTasks} open task${totalTasks === 1 ? "" : "s"}</span>
              ${waitingCount > 0 ? `<span>${waitingCount} waiting</span>` : ""}
            </div>
          </header>

          <div class="task-list">
            ${p.tasks.map(t => renderTaskCard(t, p.projectId)).join("")}
          </div>
        </section>
      `;
    }

    function renderTaskCard(task, projectId) {
      if (state.editingTaskId === task.workItemId) {
        return renderTaskEdit(task, projectId);
      }

      const isTaskOverdue = checkOverdue(task.dueDate);
      const statusDisplay = formatStatusLabel(task.itemStatus);
      const statusAttr = getStatusAttr(task.itemStatus);
      const ownerDisplay = formatOwnerDisplay(task);
      const dueDisplay = task.dueDate ? `Due ${formatShortDate(task.dueDate)}` : "";

      return `
        <article class="task-card" id="task-${escapeHtml(task.workItemId)}">
          <div class="task-main">
            <h3 class="task-title">${escapeHtml(task.title)}</h3>
            ${task.notes ? `<p class="task-description">${escapeHtml(task.notes)}</p>` : ""}
            ${task.waitingOn ? `<p class="blocker-note">Waiting on: ${escapeHtml(task.waitingOn)}</p>` : ""}
          </div>

          <footer class="task-footer">
            <div class="task-meta">
              ${dueDisplay ? `<span>${escapeHtml(dueDisplay)}</span>` : ""}
              <span class="task-status" data-status="${escapeHtml(statusAttr)}">${escapeHtml(statusDisplay)}</span>
              ${ownerDisplay ? `<span>${escapeHtml(ownerDisplay)}</span>` : ""}
              ${isTaskOverdue ? `<span class="attention">Overdue</span>` : ""}
            </div>
            <button type="button" class="task-edit" onclick="startEdit('${escapeHtml(task.workItemId)}')">Edit</button>
          </footer>
        </article>
      `;
    }

    function renderTaskEdit(task, projectId) {
      return `
        <article class="task-card" id="task-${escapeHtml(task.workItemId)}">
          <form class="task-edit-form" onsubmit="handleSaveEdit(event, '${escapeHtml(task.workItemId)}', '${escapeHtml(projectId)}')">
            <div class="edit-field-group">
              <label class="edit-field-label">Task title</label>
              <input type="text" class="edit-field" id="edit-title-${escapeHtml(task.workItemId)}" value="${escapeAttr(task.title)}" required>
            </div>

            <div class="edit-field-group">
              <label class="edit-field-label">Description / Notes</label>
              <textarea class="edit-field" id="edit-notes-${escapeHtml(task.workItemId)}" rows="2">${escapeHtml(task.notes || "")}</textarea>
            </div>

            <div class="edit-grid-row">
              <div class="edit-field-group">
                <label class="edit-field-label">Due date</label>
                <input type="date" class="edit-field" id="edit-due-${escapeHtml(task.workItemId)}" value="${escapeAttr(task.dueDate || "")}">
              </div>
              <div class="edit-field-group">
                <label class="edit-field-label">Status</label>
                <select class="edit-select" id="edit-status-${escapeHtml(task.workItemId)}">
                  <option value="ready" ${task.itemStatus === "ready" ? "selected" : ""}>Ready</option>
                  <option value="in_progress" ${task.itemStatus === "in_progress" ? "selected" : ""}>In progress</option>
                  <option value="waiting" ${task.itemStatus === "waiting" ? "selected" : ""}>Waiting</option>
                  <option value="review" ${task.itemStatus === "review" ? "selected" : ""}>Review</option>
                  <option value="complete" ${task.itemStatus === "complete" ? "selected" : ""}>Done</option>
                </select>
              </div>
            </div>

            <div class="edit-actions">
              <button type="button" class="cancel-button" onclick="cancelEdit()">Cancel</button>
              <button type="submit" class="save-button">Save</button>
            </div>
          </form>
        </article>
      `;
    }

    function startEdit(workItemId) {
      state.editingTaskId = workItemId;
      render();
    }

    function cancelEdit() {
      state.editingTaskId = null;
      render();
    }

    function handleSaveEdit(e, workItemId, projectId) {
      e.preventDefault();
      const title = document.getElementById(`edit-title-${workItemId}`)?.value.trim();
      const notes = document.getElementById(`edit-notes-${workItemId}`)?.value.trim();
      const dueDate = document.getElementById(`edit-due-${workItemId}`)?.value.trim();
      const itemStatus = document.getElementById(`edit-status-${workItemId}`)?.value;

      // Update in state
      for (const p of state.projects) {
        const found = p.tasks.find(t => t.workItemId === workItemId);
        if (found) {
          found.title = title;
          found.notes = notes;
          found.dueDate = dueDate;
          found.itemStatus = itemStatus;
          break;
        }
      }

      state.editingTaskId = null;
      render();
    }

    /* =========================================================
       HELPERS & FORMATTERS
       ========================================================= */
    function formatCategory(code) {
      if (!code) return "";
      return String(code).replace(/_/g, " · ").toUpperCase();
    }

    function formatTargetDate(dateStr) {
      if (!dateStr) return "";
      const d = parseDate(dateStr);
      if (!d) return dateStr;
      return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
    }

    function formatShortDate(dateStr) {
      if (!dateStr) return "";
      const d = parseDate(dateStr);
      if (!d) return dateStr;
      return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
    }

    function parseDate(val) {
      if (!val) return null;
      const match = String(val).match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (match) {
        return new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]));
      }
      const d = new Date(val);
      return isNaN(d.getTime()) ? null : d;
    }

    function checkOverdue(dueStr) {
      if (!dueStr) return false;
      const d = parseDate(dueStr);
      if (!d) return false;
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      return d < today;
    }

    function isWaiting(task) {
      const s = String(task.itemStatus || "").toLowerCase();
      return s === "waiting" || Boolean(task.waitingOn);
    }

    function formatStatusLabel(s) {
      const clean = String(s || "ready").toLowerCase();
      if (clean === "in_progress") return "In progress";
      if (clean === "waiting") return "Waiting";
      if (clean === "review") return "Review";
      if (clean === "complete" || clean === "done") return "Done";
      if (clean === "planned") return "Planned";
      return "Ready";
    }

    function getStatusAttr(s) {
      const clean = String(s || "").toLowerCase();
      if (clean === "waiting") return "waiting";
      if (clean === "complete" || clean === "done") return "done";
      return "default";
    }

    function formatOwnerDisplay(task) {
      const staff = String(task.ownerStaffId || "").trim();
      const label = String(task.ownerLabel || "").trim();
      const student = String(task.ownerStudentId || "").trim();

      if (label) return label;
      if (staff === "PTR-JOSH-RAGBIR") return "Josh Ragbir";
      if (staff === "STF-HYEYOUNG") return "Hyeyoung Kim";
      if (staff === "STF-KANGHO") return "Kangho Kim";
      if (staff) return staff;
      if (student === "PETER-KIM") return "Peter Kim";
      if (student === "PAUL-KIM") return "Paul Kim";
      return student;
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function escapeAttr(str) {
      return escapeHtml(str);
    }

    // INIT
    updateHeaderNav();
    fetchDashboard();
  </script>
</body>
</html>
