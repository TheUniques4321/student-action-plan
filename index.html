    function renderPendingReviewSection(task, review) {
      const section = document.createElement("div");
      section.className = "task-pending-review";

      const header = document.createElement("div");
      header.className = "task-pending-header";

      const isConflict = review.status === "CONFLICT";
      const actorLabel = review.actor ? review.actor.label : "User";
      const timeAgo = formatTimeAgo(review.createdAt);

      const label = document.createElement("div");
      label.className = "task-pending-label";

      const dot = document.createElement("span");
      dot.className = isConflict ? "task-pending-dot task-pending-dot--conflict" : "task-pending-dot";

      const text = document.createElement("span");
      text.textContent = `Awaiting review · Proposed by ${escapeHtml(actorLabel)} (${timeAgo})`;

      label.append(dot, text);

      if (isConflict) {
        const badge = document.createElement("span");
        badge.className = "badge-conflict";
        badge.textContent = "Version Conflict";
        label.appendChild(badge);
      }

      const actions = document.createElement("div");
      actions.className = "task-pending-actions";

      const isDetailsOpen = state.pendingDetailsOpen.has(review.reviewId);
      const viewBtn = document.createElement("button");
      viewBtn.type = "button";
      viewBtn.className = "btn-link";
      viewBtn.textContent = isDetailsOpen ? "Hide details" : "View proposal";
      viewBtn.onclick = () => {
        if (state.pendingDetailsOpen.has(review.reviewId)) {
          state.pendingDetailsOpen.delete(review.reviewId);
        } else {
          state.pendingDetailsOpen.add(review.reviewId);
        }
        renderProjects();
      };

      const withdrawBtn = document.createElement("button");
      withdrawBtn.type = "button";
      withdrawBtn.className = "btn-link btn-link--danger";
      withdrawBtn.textContent = "Withdraw";
      withdrawBtn.onclick = () => handleWithdrawProposal(review);

      actions.append(viewBtn, withdrawBtn);
      header.append(label, actions);
      section.appendChild(header);

      if (isDetailsOpen) {
        const details = document.createElement("div");
        details.className = "task-pending-details";

        const changes = review.changes || {};
        const changeLines = [];
        if (changes.title) changeLines.push(`• Title: "${escapeHtml(changes.title)}"`);
        if (changes.notes) changeLines.push(`• Description: "${escapeHtml(changes.notes)}"`);
        if (changes.dueDate) changeLines.push(`• Due date: ${escapeHtml(changes.dueDate)}`);
        if (changes.itemStatus) changeLines.push(`• Status: ${formatLifecycleStatus(changes.itemStatus)}`);
        if (changes.owner) {
          const ownerLabel = typeof changes.owner === "object" ? changes.owner.label : changes.owner;
          changeLines.push(`• Owner: ${escapeHtml(ownerLabel)}`);
        }

        if (changeLines.length === 0 && review.reason) {
          changeLines.push(`• Reason: ${escapeHtml(review.reason)}`);
        }

        details.innerHTML = `<strong>Proposed changes:</strong><br>${changeLines.join("<br>")}`;
        section.appendChild(details);
      }

      return section;
    }

    function renderResolutionNotice(task, res) {
      const notice = document.createElement("div");
      notice.className = "task-resolution-notice";

      const text = document.createElement("span");
      const statusText = res.status === "APPLIED" ? "applied" : (res.status === "DISMISSED" ? "withdrawn" : res.status.toLowerCase());
      const byText = res.resolvedBy ? ` by ${escapeHtml(res.resolvedBy)}` : "";
      text.textContent = `Proposal ${statusText}${byText} · ${res.resolution || "Review complete"}`;

      const dismissBtn = document.createElement("button");
      dismissBtn.type = "button";
      dismissBtn.className = "task-resolution-dismiss";
      dismissBtn.setAttribute("aria-label", "Dismiss notification");
      dismissBtn.innerHTML = "&times;";
      dismissBtn.onclick = () => dismissResolution(res.reviewId);

      notice.append(text, dismissBtn);
      return notice;
    }

    /* =========================================================
       SUBMISSION & PROPOSAL HANDLERS
       ========================================================= */
    function handleEditClick(workItemId, projectId) {
      // If editing a task inside an expanded project, make sure project stays expanded
      if (projectId && state.expandedProjects.has(projectId)) {
        state.expandedProjects.add(projectId);
      }

      const actor = getClaimedActor();
      if (!actor) {
        openActorModal((claimed) => {
          state.editingTaskId = workItemId;
          renderProjects();
        });
      } else {
        state.editingTaskId = workItemId;
        renderProjects();
      }
    }

    async function handleSubmitProposal(e, task) {
      e.preventDefault();
      const actor = getClaimedActor();
      if (!actor) {
        openActorModal(() => handleSubmitProposal(e, task));
        return;
      }

      const workItemId = task.workItemId;
      const newTitle = document.getElementById(`edit-title-${workItemId}`)?.value.trim();
      const newNotes = document.getElementById(`edit-desc-${workItemId}`)?.value.trim();
      const newDueDate = document.getElementById(`edit-due-${workItemId}`)?.value.trim();
      const newStatus = document.getElementById(`edit-status-${workItemId}`)?.value;
      const newOwnerVal = document.getElementById(`edit-owner-${workItemId}`)?.value;

      // Compute Delta
      const changes = {};
      if (newTitle !== undefined && newTitle !== (task.title || "")) {
        changes.title = newTitle;
      }
      if (newNotes !== undefined && newNotes !== (task.notes || "")) {
        changes.notes = newNotes;
      }
      if (newDueDate !== undefined && newDueDate !== (task.dueDate || "")) {
        changes.dueDate = newDueDate;
      }
      const curStatus = String(task.itemStatus || "").toLowerCase();
      if (newStatus !== undefined && newStatus !== curStatus) {
        changes.itemStatus = newStatus;
      }
      const curOwnerVal = getCurrentOwnerValue(task);
      if (newOwnerVal !== undefined && newOwnerVal.toLowerCase() !== curOwnerVal.toLowerCase()) {
        changes.owner = newOwnerVal;
      }

      if (Object.keys(changes).length === 0) {
        showToast("No changes were made to submit.");
        state.editingTaskId = null;
        renderProjects();
        return;
      }

      state.submittingTaskId = workItemId;
      renderProjects();

      const isConflict = Boolean(task.updatedAt && payload && payload.baseUpdatedAt && task.updatedAt !== payload.baseUpdatedAt);
      const detailStatus = isConflict ? "CONFLICT" : "PENDING_REVIEW";
      const detailPriority = isConflict ? "HIGH" : "NORMAL";
      const reviewId = "REV-" + Math.random().toString(36).substring(2, 10).toUpperCase();
      const now = new Date().toISOString();

      const envelope = {
        schemaVersion: 1,
        source: "WebDashboard",
        actor: {
          type: actor.type || "student",
          id: actor.id,
          label: actor.label || actor.id
        },
        studentId: state.currentStudent,
        baseUpdatedAt: task.updatedAt || "",
        status: detailStatus,
        priority: detailPriority,
        changes: changes,
        reason: "Proposed update via Student Action Plan web dashboard"
      };

      const changedFields = Object.keys(changes).join(", ");
      const question = `Review changes to "${task.title || workItemId}" proposed by ${actor.label || actor.id}`;
      const reason = `Web Dashboard edit: ${changedFields}`;

      const payload = {
        action: "CREATE_REVIEW_REQUEST",
        studentId: state.currentStudent,
        workItemId: workItemId,
        actor: actor,
        changes: changes,
        baseUpdatedAt: task.updatedAt || "",
        reason: reason
      };

      try {
        // 1. Direct Appwrite fast write (sub-50ms)
        const appwriteHeaders = {
          "X-Appwrite-Project": CONFIG.appwriteProjectId,
          "Content-Type": "application/json"
        };
        const appwriteUrl = `${CONFIG.appwriteEndpoint}/databases/${CONFIG.databaseId}/collections/review_queue/documents`;

        const appwriteRes = await fetch(appwriteUrl, {
          method: "POST",
          headers: appwriteHeaders,
          body: JSON.stringify({
            documentId: reviewId,
            data: {
              review_id: reviewId,
              created_at: now,
              entity_type: "work_item",
              entity_id: workItemId,
              question: question.substring(0, 490),
              reason: reason.substring(0, 990),
              proposed_value: JSON.stringify(envelope).substring(0, 4900),
              assigned_student_id: state.currentStudent,
              assigned_staff_id: "",
              due_date: "",
              review_priority: detailPriority.toLowerCase(),
              review_status: "open",
              resolution: "",
              resolved_by: "",
              resolved_at: ""
            },
            permissions: ['read("any")', 'update("any")', 'delete("any")', 'write("any")']
          })
        });

        // 2. Fire-and-forget background sync to Google Sheets via GAS
        fetch(CONFIG.scriptUrl, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload),
          redirect: "follow"
        }).catch(e => console.warn("Background GAS sync notice:", e));

        showToast("Proposal submitted for review.");
        state.editingTaskId = null;
        state.submittingTaskId = null;
        await fetchPlan();

      } catch (err) {
        console.error("Submission error:", err);
        showToast("Error submitting proposal: " + err.message);
        state.submittingTaskId = null;
        renderProjects();
      }
    }

    async function handleWithdrawProposal(review) {
      if (!confirm("Are you sure you want to withdraw this change proposal?")) return;

      const actor = getClaimedActor() || { type: "student", id: state.currentStudent, label: "User" };
      const actorLabel = actor.label || actor.id || "User";
      const now = new Date().toISOString();

      try {
        // 1. Direct Appwrite update
        const appwriteHeaders = {
          "X-Appwrite-Project": CONFIG.appwriteProjectId,
          "Content-Type": "application/json"
        };
        const appwriteDocUrl = `${CONFIG.appwriteEndpoint}/databases/${CONFIG.databaseId}/collections/review_queue/documents/${review.reviewId}`;

        await fetch(appwriteDocUrl, {
          method: "PATCH",
          headers: appwriteHeaders,
          body: JSON.stringify({
            data: {
              review_status: "ignored",
              resolution: `Withdrawn by ${actorLabel}`,
              resolved_by: actorLabel,
              resolved_at: now
            }
          })
        });

        // 2. Background sync to GAS
        const gasPayload = {
          action: "CANCEL_REVIEW_REQUEST",
          reviewId: review.reviewId,
          actor: actor
        };
        fetch(CONFIG.scriptUrl, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(gasPayload),
          redirect: "follow"
        }).catch(e => console.warn("Background GAS sync notice:", e));

        showToast("Proposal withdrawn.");
        await fetchPlan();

      } catch (err) {
        console.error("Withdraw error:", err);
        showToast("Error withdrawing proposal: " + err.message);
      }
    }

    /* =========================================================
       LOCAL STORAGE HELPERS (Dismissed notices)
       ========================================================= */
    function getDismissedResolutionIds() {
      try {
        const raw = localStorage.getItem("sap_dismissed_resolutions");
        const arr = raw ? JSON.parse(raw) : [];
        return new Set(Array.isArray(arr) ? arr : []);
      } catch (e) {
        return new Set();
      }
    }

    function dismissResolution(reviewId) {
      const dismissed = getDismissedResolutionIds();
      dismissed.add(reviewId);
      localStorage.setItem("sap_dismissed_resolutions", JSON.stringify(Array.from(dismissed)));
      renderProjects();
    }

    function showToast(msg) {
      const existing = document.querySelector(".toast-notice");
      if (existing) existing.remove();

      const toast = document.createElement("div");
      toast.className = "toast-notice";
      toast.textContent = msg;
      document.body.appendChild(toast);

      setTimeout(() => {
        toast.remove();
      }, 4000);
    }

    /* =========================================================
       SPECIFICATION HELPERS
       ========================================================= */
    function getCurrentOwnerValue(task) {
      if (task.ownerStudentId) return "student:" + task.ownerStudentId;
      if (task.ownerStaffId) return "staff:" + task.ownerStaffId;
      if (task.ownerLabel) return "label:" + task.ownerLabel;
      return "student:" + state.currentStudent;
    }

    function resolveOwnerText(task) {
      const label = String(task.ownerLabel || "").trim();
      if (label) return label;

      const staff = String(task.ownerStaffId || "").trim();
      if (staff === "PTR-JOSH-RAGBIR") return "Josh Ragbir";
      if (staff === "STF-KANGHO") return "Kangho Kim";
      if (staff) return staff;

      const student = String(task.ownerStudentId || "").trim();
      if (student === "PETER-KIM" || student === "STU-001") return "Peter Kim";
      if (student === "PAUL-KIM" || student === "STU-002") return "Paul Kim";
      return student;
    }

    function getDueAttention(value) {
      const due = parseDate(value);
      if (!due) return "";

      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const dueDay = new Date(due.getFullYear(), due.getMonth(), due.getDate());
      const dayMs = 24 * 60 * 60 * 1000;
      const difference = Math.round((dueDay - today) / dayMs);

      if (difference < 0) {
        const days = Math.abs(difference);
        return days === 1 ? "1 day overdue" : `${days} days overdue`;
      }
      if (difference === 0) return "Due today";
      if (difference === 1) return "Due tomorrow";
      return "";
    }

    function formatLifecycleStatus(value) {
      const normalized = String(value || "").trim().toLowerCase().replaceAll("_", " ");
      const statuses = {
        "planned": "Planned",
        "ready": "Ready",
        "in progress": "In progress",
        "waiting": "Waiting",
        "review": "Review",
        "done": "Done"
      };
      return statuses[normalized] || value || "Ready";
    }

    function formatCategoryEyebrow(code) {
      if (!code) return "";
      return String(code).replace(/_/g, " · ").toUpperCase();
    }

    function formatShortMonthDay(val) {
      const d = parseDate(val);
      if (!d) return val;
      return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
    }

    function formatClockTime(date) {
      if (!date) return "";
      return date.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
    }

    function formatTimeAgo(dateStr) {
      if (!dateStr) return "recently";
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return "recently";
      const sec = Math.round((Date.now() - d.getTime()) / 1000);
      if (sec < 60) return "just now";
      const min = Math.round(sec / 60);
      if (min < 60) return `${min}m ago`;
      const hrs = Math.round(min / 60);
      if (hrs < 24) return `${hrs}h ago`;
      const days = Math.round(hrs / 24);
      return `${days}d ago`;
    }

    function parseDate(val) {
      if (!val) return null;
      const m = String(val).match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (m) return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
      const d = new Date(val);
      return isNaN(d.getTime()) ? null : d;
    }

    function isWaiting(task) {
      const s = String(task.itemStatus || "").toLowerCase();
      return s === "waiting" || Boolean(task.waitingOn);
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // INITIALIZATION
    window.addEventListener("popstate", () => {
      const sp = new URLSearchParams(window.location.search);
      const s = sp.get("student") || localStorage.getItem("sap_active_student") || "PETER-KIM";
      if (s.trim().toUpperCase() !== state.currentStudent) {
        selectStudent(s);
      }
    });

    updateStudentButtons();
    updateActorHeaderDisplay();
    fetchPlan();
  </script>
</body>
