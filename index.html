<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Student Action Brief — Projects, Tasks, and Role-Based Action Items">
  <title>Student Action Brief</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    /* =========================================================
       1. DESIGN TOKENS
       ========================================================= */
    :root {
      --font-sans: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, monospace;

      /* Primary / Brand */
      --primary-50: #eff6ff;
      --primary-100: #dbeafe;
      --primary-200: #bfdbfe;
      --primary-500: #3b82f6;
      --primary-600: #2563eb;
      --primary-700: #1d4ed8;

      /* Surfaces */
      --bg-base: #f8fafc;
      --surface-card: #ffffff;
      --surface-subtle: #f1f5f9;
      --surface-hover: #e2e8f0;
      --border: #e2e8f0;
      --border-focus: #3b82f6;

      /* Text */
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-subtle: #94a3b8;

      /* Role Accents */
      --role-student-bg: #eff6ff;
      --role-student-border: #bfdbfe;
      --role-student-text: #1d4ed8;
      --role-student-badge: #2563eb;

      --role-parent-bg: #fdf4ff;
      --role-parent-border: #f5d0fe;
      --role-parent-text: #a21caf;
      --role-parent-badge: #c026d3;

      --role-me-bg: #f0fdf4;
      --role-me-border: #bbf7d0;
      --role-me-text: #15803d;
      --role-me-badge: #16a34a;

      /* Status Accents */
      --status-ready-bg: #f1f5f9;
      --status-ready-text: #475569;
      --status-progress-bg: #e0f2fe;
      --status-progress-text: #0369a1;
      --status-waiting-bg: #fef3c7;
      --status-waiting-text: #b45309;
      --status-urgent-bg: #fee2e2;
      --status-urgent-text: #b91c1c;

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-full: 9999px;

      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.07), 0 2px 4px -2px rgb(0 0 0 / 0.05);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.08), 0 4px 6px -4px rgb(0 0 0 / 0.04);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-base: #0b0f19;
        --surface-card: #131b2e;
        --surface-subtle: #1e293b;
        --surface-hover: #334155;
        --border: #1e293b;
        --border-focus: #60a5fa;

        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --text-subtle: #64748b;

        --role-student-bg: rgba(37, 99, 235, 0.12);
        --role-student-border: rgba(96, 165, 250, 0.3);
        --role-student-text: #93c5fd;

        --role-parent-bg: rgba(192, 38, 211, 0.12);
        --role-parent-border: rgba(245, 208, 254, 0.25);
        --role-parent-text: #f0abfc;

        --role-me-bg: rgba(22, 163, 74, 0.12);
        --role-me-border: rgba(187, 247, 208, 0.25);
        --role-me-text: #86efac;

        --status-ready-bg: #1e293b;
        --status-ready-text: #cbd5e1;
        --status-progress-bg: rgba(14, 165, 233, 0.18);
        --status-progress-text: #7dd3fc;
        --status-waiting-bg: rgba(245, 158, 11, 0.18);
        --status-waiting-text: #fcd34d;
        --status-urgent-bg: rgba(239, 68, 68, 0.18);
        --status-urgent-text: #fca5a5;
      }
    }

    /* =========================================================
       2. RESET & BASE
       ========================================================= */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      background-color: var(--bg-base);
      color: var(--text-main);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      padding: 1.5rem 1rem 4rem;
    }

    .container {
      max-width: 1040px;
      margin: 0 auto;
    }

    /* =========================================================
       3. HEADER & CONTROLS
       ========================================================= */
    .header {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    .header-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .brand-title {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .brand-badge {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 0.2rem 0.5rem;
      background: var(--primary-100);
      color: var(--primary-700);
      border-radius: var(--radius-sm);
      letter-spacing: 0.05em;
    }

    .header-meta {
      font-size: 0.875rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .student-selector-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      background: var(--surface-card);
      padding: 0.75rem 1rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }

    .quick-students {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .quick-label {
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .student-btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface-subtle);
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 600;
      padding: 0.375rem 0.875rem;
      border-radius: var(--radius-full);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .student-btn:hover {
      background: var(--surface-hover);
      border-color: var(--border-focus);
    }

    .student-btn.active {
      background: var(--primary-600);
      color: #ffffff;
      border-color: var(--primary-600);
      box-shadow: 0 2px 4px rgba(37, 99, 235, 0.25);
    }

    .custom-student-form {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .custom-input {
      padding: 0.375rem 0.75rem;
      font-size: 0.875rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg-base);
      color: var(--text-main);
      width: 140px;
    }

    .custom-input:focus {
      outline: none;
      border-color: var(--border-focus);
    }

    .btn-submit {
      padding: 0.375rem 0.75rem;
      font-size: 0.875rem;
      font-weight: 600;
      background: var(--surface-hover);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
    }

    /* =========================================================
       4. SUMMARY METRICS BAR
       ========================================================= */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .metric-card {
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 0.875rem 1rem;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .metric-card.role-student { border-left: 4px solid var(--role-student-badge); }
    .metric-card.role-parent { border-left: 4px solid var(--role-parent-badge); }
    .metric-card.role-me { border-left: 4px solid var(--role-me-badge); }
    .metric-card.role-waiting { border-left: 4px solid #f59e0b; }

    .metric-num {
      font-size: 1.5rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .metric-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* =========================================================
       5. VIEW TABS & FILTER BAR
       ========================================================= */
    .view-tabs-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .tab-group {
      display: inline-flex;
      background: var(--surface-subtle);
      padding: 0.25rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      gap: 0.25rem;
    }

    .tab-btn {
      appearance: none;
      border: none;
      background: transparent;
      padding: 0.375rem 0.875rem;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-muted);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 0.375rem;
    }

    .tab-btn:hover { color: var(--text-main); }

    .tab-btn.active {
      background: var(--surface-card);
      color: var(--text-main);
      box-shadow: var(--shadow-sm);
    }

    .search-box {
      position: relative;
    }

    .search-input {
      padding: 0.375rem 0.75rem 0.375rem 2rem;
      font-size: 0.875rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface-card);
      color: var(--text-main);
      width: 220px;
    }

    .search-icon {
      position: absolute;
      left: 0.625rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.875rem;
      color: var(--text-subtle);
      pointer-events: none;
    }

    /* =========================================================
       6. PROJECT CARDS (PROJECT -> ROLE -> ACTION)
       ========================================================= */
    .projects-stack {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .project-card {
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.25rem 1.5rem;
      box-shadow: var(--shadow-sm);
      transition: box-shadow 0.2s ease;
    }

    .project-card:hover {
      box-shadow: var(--shadow-md);
    }

    .project-header {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
    }

    .project-title-area {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      max-width: 70%;
    }

    .project-name {
      font-size: 1.125rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text-main);
    }

    .project-badges {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
    }

    .badge {
      font-size: 0.6875rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0.15rem 0.45rem;
      border-radius: var(--radius-sm);
    }

    .badge-category {
      background: var(--surface-subtle);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .badge-status {
      background: var(--primary-50);
      color: var(--primary-700);
      border: 1px solid var(--primary-200);
    }

    .badge-date {
      font-size: 0.75rem;
      font-family: var(--font-mono);
      color: var(--text-muted);
    }

    /* Role Buckets inside Project */
    .role-sections {
      display: flex;
      flex-direction: column;
      gap: 0.875rem;
    }

    .role-bucket {
      border-radius: var(--radius-md);
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
    }

    .role-bucket.student {
      background: var(--role-student-bg);
      border-color: var(--role-student-border);
    }

    .role-bucket.parent {
      background: var(--role-parent-bg);
      border-color: var(--role-parent-border);
    }

    .role-bucket.me {
      background: var(--role-me-bg);
      border-color: var(--role-me-border);
    }

    .role-bucket-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.5rem;
    }

    .role-bucket-title {
      font-size: 0.8125rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      display: flex;
      align-items: center;
      gap: 0.375rem;
    }

    .role-bucket.student .role-bucket-title { color: var(--role-student-text); }
    .role-bucket.parent .role-bucket-title { color: var(--role-parent-text); }
    .role-bucket.me .role-bucket-title { color: var(--role-me-text); }

    .role-count-pill {
      font-size: 0.6875rem;
      font-weight: 800;
      padding: 0.1rem 0.4rem;
      border-radius: var(--radius-full);
      background: rgba(0, 0, 0, 0.08);
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .task-item {
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.625rem 0.875rem;
      display: flex;
      flex-direction: column;
      gap: 0.375rem;
    }

    .task-main-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .task-title {
      font-size: 0.9375rem;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.4;
    }

    .task-tags {
      display: flex;
      align-items: center;
      gap: 0.375rem;
      flex-shrink: 0;
    }

    .tag-priority-high {
      font-size: 0.6875rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 0.1rem 0.4rem;
      background: var(--status-urgent-bg);
      color: var(--status-urgent-text);
      border-radius: var(--radius-sm);
    }

    .tag-status {
      font-size: 0.6875rem;
      font-weight: 600;
      padding: 0.1rem 0.4rem;
      border-radius: var(--radius-sm);
      background: var(--status-ready-bg);
      color: var(--status-ready-text);
      text-transform: capitalize;
    }

    .tag-status.waiting {
      background: var(--status-waiting-bg);
      color: var(--status-waiting-text);
      font-weight: 700;
    }

    .tag-status.in_progress {
      background: var(--status-progress-bg);
      color: var(--status-progress-text);
    }

    .task-blocker-row {
      font-size: 0.8125rem;
      color: var(--status-waiting-text);
      background: var(--status-waiting-bg);
      padding: 0.25rem 0.5rem;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      gap: 0.375rem;
      font-weight: 500;
    }

    .task-notes-row {
      font-size: 0.8125rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .task-footer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-subtle);
      margin-top: 0.125rem;
    }

    .task-due {
      font-family: var(--font-mono);
      font-weight: 500;
    }

    .task-owner-subtle {
      font-style: italic;
    }

    /* =========================================================
       7. EMPTY & LOADING STATES
       ========================================================= */
    .loading-state, .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
    }

    .spinner {
      width: 2rem;
      height: 2rem;
      border: 3px solid var(--border);
      border-top-color: var(--primary-600);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .state-title {
      font-size: 1.125rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    .state-desc {
      font-size: 0.875rem;
      color: var(--text-muted);
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- HEADER -->
    <header class="header">
      <div class="header-top">
        <div class="brand-title">
          <span>⚡ Student Action Brief</span>
          <span class="brand-badge">Executive View</span>
        </div>
        <div class="header-meta">
          <span id="active-student-display">Peter Kim</span>
          <span>·</span>
          <span id="last-updated-display">Loading…</span>
        </div>
      </div>

      <!-- STUDENT SELECTOR -->
      <div class="student-selector-bar">
        <div class="quick-students">
          <span class="quick-label">Student:</span>
          <button type="button" class="student-btn active" data-id="PETER-KIM" onclick="selectStudent('PETER-KIM')">Peter Kim</button>
          <button type="button" class="student-btn" data-id="PAUL-KIM" onclick="selectStudent('PAUL-KIM')">Paul Kim</button>
        </div>
        <form class="custom-student-form" onsubmit="handleCustomStudent(event)">
          <input type="text" id="custom-student-input" class="custom-input" placeholder="Other ID…">
          <button type="submit" class="btn-submit">Load</button>
        </form>
      </div>
    </header>

    <!-- SUMMARY METRICS -->
    <section class="metrics-grid" id="metrics-bar">
      <div class="metric-card">
        <span class="metric-num" id="m-projects">-</span>
        <span class="metric-label">Active Projects</span>
      </div>
      <div class="metric-card role-student">
        <span class="metric-num" id="m-student">-</span>
        <span class="metric-label">Student Actions</span>
      </div>
      <div class="metric-card role-parent">
        <span class="metric-num" id="m-parent">-</span>
        <span class="metric-label">Parent Actions</span>
      </div>
      <div class="metric-card role-me">
        <span class="metric-num" id="m-me">-</span>
        <span class="metric-label">Counselor Actions</span>
      </div>
      <div class="metric-card role-waiting">
        <span class="metric-num" id="m-waiting">-</span>
        <span class="metric-label">Blocked / Waiting</span>
      </div>
    </section>

    <!-- VIEW TABS & SEARCH -->
    <div class="view-tabs-bar">
      <div class="tab-group" role="tablist">
        <button type="button" class="tab-btn active" id="tab-projects" onclick="switchView('projects')">
          📁 Project Hierarchy
        </button>
        <button type="button" class="tab-btn" id="tab-roles" onclick="switchView('roles')">
          👥 By Stakeholder (Role)
        </button>
        <button type="button" class="tab-btn" id="tab-priority" onclick="switchView('priority')">
          ⚡ Priority Feed
        </button>
      </div>
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="filter-search" class="search-input" placeholder="Filter projects or tasks…" oninput="handleSearch(this.value)">
      </div>
    </div>

    <!-- MAIN CONTENT CONTAINER -->
    <main id="main-content">
      <div class="loading-state">
        <div class="spinner"></div>
        <div class="state-title">Loading Action Brief…</div>
        <div class="state-desc">Connecting to academic operations backend</div>
      </div>
    </main>

  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    "use strict";

    const CONFIG = {
      scriptUrl: "https://script.google.com/macros/s/AKfycbzivDKDfsgEKyza4GHL8D-NmkgcdKKn0zuT1kxeR6ZDxDGOz8X069Kpg9lnPfgpNrfmIw/exec",
      defaultStudent: "PETER-KIM"
    };

    const state = {
      currentStudent: getInitialStudent(),
      currentView: "projects", // "projects" | "roles" | "priority"
      searchQuery: "",
      briefData: null,
      rawTodos: []
    };

    function getInitialStudent() {
      const p = new URLSearchParams(window.location.search).get("student");
      return (p ? p.trim().toUpperCase() : "") || localStorage.getItem("action_brief_student") || CONFIG.defaultStudent;
    }

    function selectStudent(studentId) {
      if (!studentId) return;
      state.currentStudent = studentId.trim().toUpperCase();
      localStorage.setItem("action_brief_student", state.currentStudent);
      
      const url = new URL(window.location.href);
      url.searchParams.set("student", state.currentStudent);
      window.history.pushState({}, "", url);

      updateStudentButtons();
      fetchDashboardData();
    }

    function handleCustomStudent(e) {
      e.preventDefault();
      const val = document.getElementById("custom-student-input").value;
      if (val) {
        selectStudent(val);
        document.getElementById("custom-student-input").value = "";
      }
    }

    function updateStudentButtons() {
      document.querySelectorAll(".student-btn").forEach(btn => {
        btn.classList.toggle("active", btn.getAttribute("data-id") === state.currentStudent);
      });
      const nameEl = document.getElementById("active-student-display");
      if (nameEl) {
        nameEl.textContent = state.currentStudent === "PETER-KIM" ? "Peter Kim" : (state.currentStudent === "PAUL-KIM" ? "Paul Kim" : state.currentStudent);
      }
    }

    function switchView(viewName) {
      state.currentView = viewName;
      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.classList.toggle("active", btn.id === `tab-${viewName}`);
      });
      renderCurrentView();
    }

    function handleSearch(query) {
      state.searchQuery = String(query || "").trim().toLowerCase();
      renderCurrentView();
    }

    async function fetchDashboardData() {
      const mainEl = document.getElementById("main-content");
      mainEl.innerHTML = `
        <div class="loading-state">
          <div class="spinner"></div>
          <div class="state-title">Loading Action Brief for ${state.currentStudent}…</div>
          <div class="state-desc">Fetching live Projects and Work Items</div>
        </div>
      `;

      try {
        const url = `${CONFIG.scriptUrl}?student=${encodeURIComponent(state.currentStudent)}&_t=${Date.now()}`;
        const res = await fetch(url, { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP status ${res.status}`);
        
        const data = await res.json();
        state.briefData = data.actionBrief || null;
        state.rawTodos = data.todos || [];

        if (data.lastUpdated) {
          document.getElementById("last-updated-display").textContent = new Date(data.lastUpdated).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        updateMetrics();
        renderCurrentView();

      } catch (err) {
        console.error("Fetch error:", err);
        mainEl.innerHTML = `
          <div class="empty-state">
            <div class="state-title">Connection Error</div>
            <div class="state-desc">Could not load live Action Brief. Please verify network or try again.</div>
            <button class="btn-submit" style="margin-top: 1rem;" onclick="fetchDashboardData()">Retry</button>
          </div>
        `;
      }
    }

    function updateMetrics() {
      const brief = state.briefData;
      if (!brief || !brief.summary) return;

      document.getElementById("m-projects").textContent = brief.summary.activeProjectsCount || 0;
      document.getElementById("m-student").textContent = brief.summary.studentTasks || 0;
      document.getElementById("m-parent").textContent = brief.summary.parentTasks || 0;
      document.getElementById("m-me").textContent = brief.summary.myTasks || 0;
      document.getElementById("m-waiting").textContent = brief.summary.waitingTasks || 0;
    }

    function renderCurrentView() {
      const mainEl = document.getElementById("main-content");
      if (!state.briefData || !state.briefData.projects || state.briefData.projects.length === 0) {
        mainEl.innerHTML = `
          <div class="empty-state">
            <div class="state-title">No Active Action Items</div>
            <div class="state-desc">No tasks currently scheduled for ${state.currentStudent}.</div>
          </div>
        `;
        return;
      }

      if (state.currentView === "projects") {
        renderProjectsHierarchy(mainEl);
      } else if (state.currentView === "roles") {
        renderByRoles(mainEl);
      } else {
        renderPriorityFeed(mainEl);
      }
    }

    /* 1. PROJECT HIERARCHY VIEW */
    function renderProjectsHierarchy(container) {
      const q = state.searchQuery;
      let projects = state.briefData.projects;

      if (q) {
        projects = projects.filter(p => {
          const matchProject = p.projectName.toLowerCase().includes(q) || (p.categoryCode && p.categoryCode.toLowerCase().includes(q));
          const matchTasks = ["student", "parent", "me"].some(role => 
            p.roles[role].some(t => t.title.toLowerCase().includes(q) || (t.notes && t.notes.toLowerCase().includes(q)))
          );
          return matchProject || matchTasks;
        });
      }

      if (projects.length === 0) {
        container.innerHTML = `<div class="empty-state"><div class="state-title">No matching projects</div><div class="state-desc">Try clearing the search filter.</div></div>`;
        return;
      }

      let html = `<div class="projects-stack">`;

      projects.forEach(p => {
        const hasStudent = p.roles.student.length > 0;
        const hasParent = p.roles.parent.length > 0;
        const hasMe = p.roles.me.length > 0;

        if (!hasStudent && !hasParent && !hasMe && p.counts.total === 0) return; // skip empty inactive

        html += `
          <article class="project-card">
            <div class="project-header">
              <div class="project-title-area">
                <h2 class="project-name">${escapeHtml(p.projectName)}</h2>
                <div class="project-badges">
                  ${p.categoryCode ? `<span class="badge badge-category">${escapeHtml(p.categoryCode)}</span>` : ""}
                  <span class="badge badge-status">${escapeHtml(p.projectStatus)}</span>
                  ${p.targetDate ? `<span class="badge-date">🎯 Target: ${escapeHtml(p.targetDate)}</span>` : ""}
                </div>
              </div>
            </div>

            <div class="role-sections">
              ${hasStudent ? renderRoleBucket("student", "👤 Student Actions", p.roles.student) : ""}
              ${hasParent ? renderRoleBucket("parent", "👨‍👩‍👦 Parent Actions", p.roles.parent) : ""}
              ${hasMe ? renderRoleBucket("me", "💼 Counselor (Me) Actions", p.roles.me) : ""}
            </div>
          </article>
        `;
      });

      html += `</div>`;
      container.innerHTML = html;
    }

    function renderRoleBucket(roleKey, roleTitle, tasks) {
      return `
        <div class="role-bucket ${roleKey}">
          <div class="role-bucket-header">
            <span class="role-bucket-title">${roleTitle}</span>
            <span class="role-count-pill">${tasks.length}</span>
          </div>
          <div class="task-list">
            ${tasks.map(t => renderTaskItem(t)).join("")}
          </div>
        </div>
      `;
    }

    function renderTaskItem(t) {
      const isHigh = String(t.priority).toLowerCase() === "high";
      const isWaiting = String(t.itemStatus).toLowerCase() === "waiting" || Boolean(t.waitingOn);

      return `
        <div class="task-item">
          <div class="task-main-row">
            <div class="task-title">${escapeHtml(t.title)}</div>
            <div class="task-tags">
              ${isHigh ? `<span class="tag-priority-high">High</span>` : ""}
              <span class="tag-status ${isWaiting ? "waiting" : (t.itemStatus === "in_progress" ? "in_progress" : "")}">${escapeHtml(t.itemStatus || "ready")}</span>
            </div>
          </div>

          ${t.waitingOn ? `
            <div class="task-blocker-row">
              <span>⏳ Waiting on:</span> <strong>${escapeHtml(t.waitingOn)}</strong>
            </div>
          ` : ""}

          ${t.notes ? `<div class="task-notes-row">${escapeHtml(t.notes)}</div>` : ""}

          <div class="task-footer-row">
            <span class="task-due">${t.dueDate ? `📅 Due ${escapeHtml(t.dueDate)}` : ""}</span>
            <span class="task-owner-subtle">${t.ownerDisplay ? escapeHtml(t.ownerDisplay) : ""}</span>
          </div>
        </div>
      `;
    }

    /* 2. BY ROLES VIEW */
    function renderByRoles(container) {
      const allProjects = state.briefData.projects || [];
      const studentTasks = [];
      const parentTasks = [];
      const meTasks = [];

      allProjects.forEach(p => {
        p.roles.student.forEach(t => studentTasks.push({ ...t, projectName: p.projectName }));
        p.roles.parent.forEach(t => parentTasks.push({ ...t, projectName: p.projectName }));
        p.roles.me.forEach(t => meTasks.push({ ...t, projectName: p.projectName }));
      });

      container.innerHTML = `
        <div class="projects-stack">
          <div class="role-bucket student" style="background: var(--surface-card); border-left: 5px solid var(--role-student-badge);">
            <div class="role-bucket-header">
              <span class="role-bucket-title" style="font-size: 1rem;">👤 All Student Actions</span>
              <span class="role-count-pill">${studentTasks.length}</span>
            </div>
            <div class="task-list">
              ${studentTasks.map(t => renderTaskItemWithProject(t)).join("")}
            </div>
          </div>

          <div class="role-bucket parent" style="background: var(--surface-card); border-left: 5px solid var(--role-parent-badge);">
            <div class="role-bucket-header">
              <span class="role-bucket-title" style="font-size: 1rem;">👨‍👩‍👦 All Parent Actions</span>
              <span class="role-count-pill">${parentTasks.length}</span>
            </div>
            <div class="task-list">
              ${parentTasks.length > 0 ? parentTasks.map(t => renderTaskItemWithProject(t)).join("") : `<div class="task-notes-row" style="padding: 0.5rem;">No pending parent actions.</div>`}
            </div>
          </div>

          <div class="role-bucket me" style="background: var(--surface-card); border-left: 5px solid var(--role-me-badge);">
            <div class="role-bucket-header">
              <span class="role-bucket-title" style="font-size: 1rem;">💼 All Counselor (Me) Actions</span>
              <span class="role-count-pill">${meTasks.length}</span>
            </div>
            <div class="task-list">
              ${meTasks.map(t => renderTaskItemWithProject(t)).join("")}
            </div>
          </div>
        </div>
      `;
    }

    function renderTaskItemWithProject(t) {
      return `
        <div class="task-item">
          <div style="font-size: 0.75rem; font-weight: 700; color: var(--primary-600); margin-bottom: 0.2rem;">
            📁 ${escapeHtml(t.projectName)}
          </div>
          ${renderTaskItem(t)}
        </div>
      `;
    }

    /* 3. PRIORITY FEED VIEW */
    function renderPriorityFeed(container) {
      const allProjects = state.briefData.projects || [];
      const allTasks = [];
      allProjects.forEach(p => {
        ["student", "parent", "me"].forEach(r => {
          p.roles[r].forEach(t => allTasks.push({ ...t, projectName: p.projectName }));
        });
      });

      const highTasks = allTasks.filter(t => String(t.priority).toLowerCase() === "high");
      const waitingTasks = allTasks.filter(t => String(t.itemStatus).toLowerCase() === "waiting" || Boolean(t.waitingOn));
      const regularTasks = allTasks.filter(t => String(t.priority).toLowerCase() !== "high" && String(t.itemStatus).toLowerCase() !== "waiting" && !t.waitingOn);

      container.innerHTML = `
        <div class="projects-stack">
          ${highTasks.length > 0 ? `
            <div class="role-bucket" style="background: var(--status-urgent-bg); border: 1px solid var(--status-urgent-text);">
              <div class="role-bucket-header">
                <span class="role-bucket-title" style="color: var(--status-urgent-text);">🔥 High Priority Needed Now</span>
                <span class="role-count-pill">${highTasks.length}</span>
              </div>
              <div class="task-list">${highTasks.map(t => renderTaskItemWithProject(t)).join("")}</div>
            </div>
          ` : ""}

          ${waitingTasks.length > 0 ? `
            <div class="role-bucket" style="background: var(--status-waiting-bg); border: 1px solid var(--status-waiting-text);">
              <div class="role-bucket-header">
                <span class="role-bucket-title" style="color: var(--status-waiting-text);">⏳ Blocked & Waiting Items</span>
                <span class="role-count-pill">${waitingTasks.length}</span>
              </div>
              <div class="task-list">${waitingTasks.map(t => renderTaskItemWithProject(t)).join("")}</div>
            </div>
          ` : ""}

          <div class="role-bucket" style="background: var(--surface-card); border: 1px solid var(--border);">
            <div class="role-bucket-header">
              <span class="role-bucket-title" style="color: var(--text-main);">📋 Active Roadmap</span>
              <span class="role-count-pill">${regularTasks.length}</span>
            </div>
            <div class="task-list">${regularTasks.map(t => renderTaskItemWithProject(t)).join("")}</div>
          </div>
        </div>
      `;
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // INIT
    updateStudentButtons();
    fetchDashboardData();
  </script>
</body>
</html>
