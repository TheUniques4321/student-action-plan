<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Action Plan</title>

  <!-- Exact Google Fonts Import -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Source+Sans+3:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>
    /* =========================================================
       1. EXACT DESIGN TOKENS
       ========================================================= */
    :root {
      color-scheme: dark;

      /* Typography */
      --font-display: "Newsreader", Georgia, serif;
      --font-ui: "Source Sans 3", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;

      /* Surfaces */
      --canvas: #15130f;
      --surface-1: #1c1915;
      --surface-2: #211d18;
      --surface-3: #28251f;

      /* Text */
      --text-primary: #ebe4d8;
      --text-secondary: #bdb4a6;
      --text-muted: #8f8679;
      --text-interactive: #aaa195;
      --text-faint: #686259;

      /* Borders */
      --border-subtle: rgba(238, 233, 223, 0.06);
      --border-default: rgba(238, 233, 223, 0.105);
      --border-strong: rgba(238, 233, 223, 0.18);

      /* Accent */
      --accent: #c39161;
      --accent-hover: #d0a071;

      /* Semantic */
      --danger: #cf776e;
      --info: #8297a4;
      --success: #829b7a;

      /* Layout */
      --content-width: 960px;

      /* Shape */
      --radius-card: 5px;
      --radius-control: 6px;

      /* Motion */
      --transition-fast: 150ms ease;
    }

    /* =========================================================
       2. RESET & BASE
       ========================================================= */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      margin: 0;

      font-family: var(--font-ui);
      font-size: 16px;
      font-weight: 400;
      line-height: 1.5;

      color: var(--text-primary);

      background:
        radial-gradient(
          circle at 18% -8%,
          rgba(195, 145, 97, 0.05),
          transparent 520px
        ),
        radial-gradient(
          circle at 88% 28%,
          rgba(255, 255, 255, 0.015),
          transparent 440px
        ),
        var(--canvas);

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* Substrate grain */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none;

      opacity: 0.034;
      mix-blend-mode: soft-light;

      background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.72'/%3E%3C/svg%3E");
    }

    /* Sparse faint dust specks */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 9998;
      pointer-events: none;

      opacity: 0.16;

      background-image:
        radial-gradient(circle at 12% 17%, rgba(238,233,223,.09) 0 0.5px, transparent 0.8px),
        radial-gradient(circle at 73% 31%, rgba(238,233,223,.07) 0 0.45px, transparent 0.75px),
        radial-gradient(circle at 41% 76%, rgba(238,233,223,.08) 0 0.45px, transparent 0.75px),
        radial-gradient(circle at 89% 68%, rgba(238,233,223,.06) 0 0.4px, transparent 0.7px);

      background-size:
        137px 149px,
        181px 163px,
        211px 197px,
        157px 223px;
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    button {
      transition:
        color 120ms ease,
        background-color 120ms ease,
        border-color 120ms ease,
        transform 60ms ease;
    }

    button:active {
      transform: translateY(1px);
    }

    .task-card,
    .project,
    .global-next-action {
      transform: none;
    }

    /* =========================================================
       3. PAGE SHELL
       ========================================================= */
    .page-shell {
      width: min(calc(100% - 32px), var(--content-width));
      margin-inline: auto;

      padding-top: 24px;
      padding-bottom: 80px;
    }

    @media (min-width: 768px) {
      .page-shell {
        padding-top: 24px;
      }
    }

    /* =========================================================
       4. APPLICATION HEADER
       ========================================================= */
    .app-header {
      display: grid;
      gap: 18px;

      margin-bottom: 48px;
    }

    .app-header__top {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    @media (min-width: 640px) {
      .app-header__top {
        flex-direction: row;
        align-items: baseline;
        justify-content: space-between;
      }
    }

    .app-header__title {
      font-family: var(--font-display);
      font-size: 34px;
      font-weight: 500;
      line-height: 1.15;
      letter-spacing: -0.012em;

      color: var(--text-primary);
    }

    .app-header__context {
      font-size: 14px;
      font-weight: 400;
      line-height: 1.4;

      color: var(--text-muted);
    }

    .app-header__meta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .app-header__controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .app-header__actor-tag {
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .actor-tag-btn {
      background: none;
      border: none;
      color: var(--accent);
      cursor: pointer;
      font-family: var(--font-ui);
      font-size: 13px;
      padding: 0;
    }
    .actor-tag-btn:hover {
      text-decoration: underline;
    }

    /* =========================================================
       5. STUDENT SELECTOR CHIPS
       ========================================================= */
    .choice-chip {
      appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;

      padding: 7px 15px;

      font-family: var(--font-ui);
      font-size: 14px;
      font-weight: 500;
      line-height: 1.2;

      color: var(--text-interactive);
      background-color: var(--surface-1);

      border: 1px solid var(--border-default);
      border-radius: 9999px;

      cursor: pointer;
      user-select: none;
      text-decoration: none;

      transition:
        color var(--transition-fast),
        border-color var(--transition-fast),
        background-color var(--transition-fast);
    }

    .choice-chip:hover {
      color: var(--text-primary);
      border-color: var(--border-strong);
      background-color: var(--surface-2);
    }

    .choice-chip[aria-current="true"] {
      color: var(--text-primary);
      border-color: var(--accent);
      background-color: var(--surface-2);
    }

    .choice-chip--ghost {
      color: var(--text-muted);
      border-style: dashed;
      background-color: transparent;
    }

    .choice-chip--ghost:hover {
      color: var(--text-primary);
      border-color: var(--accent);
      background-color: var(--surface-1);
    }

    .custom-student-form {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-left: 4px;
    }

    .custom-student-input {
      background: var(--surface-2);
      border: 1px solid var(--border-default);
      border-radius: 9999px;
      padding: 6px 12px;
      color: var(--text-primary);
      font-family: var(--font-ui);
      font-size: 13px;
      outline: none;
    }
    .custom-student-input:focus {
      border-color: var(--accent);
    }

    /* =========================================================
       6. GLOBAL NEXT ACTION COMPONENT
       ========================================================= */
    .global-next-action {
      margin-bottom: 56px;
      padding-bottom: 40px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .global-next-action__eyebrow {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 14px;
    }

    .global-next-action__card {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 22px 24px;
      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,.018),
          rgba(255,255,255,.002) 38%,
          rgba(0,0,0,.018)
        ),
        var(--surface-1);
      border: 1px solid rgba(238,233,223,.075);
      border-radius: var(--radius-card);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.018),
        inset 0 -1px 0 rgba(0,0,0,.22);
      transition: border-color var(--transition-fast), background-color var(--transition-fast);
    }

    @media (min-width: 640px) {
      .global-next-action__card {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
    }

    .global-next-action__card:hover {
      border-color: var(--border-strong);
      background-color: var(--surface-2);
    }

    .global-next-action__title {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 500;
      color: var(--text-primary);
      line-height: 1.25;
      margin-bottom: 6px;
    }

    .global-next-action__meta {
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .global-next-action__btn {
      appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 18px;
      font-family: var(--font-ui);
      font-size: 14px;
      font-weight: 500;
      color: #141310;
      background: var(--accent);
      border: 1px solid var(--accent);
      border-radius: var(--radius-control);
      cursor: pointer;
      text-decoration: none;
      flex-shrink: 0;
      transition: background-color var(--transition-fast);
    }

    .global-next-action__btn:hover {
      background: var(--accent-hover);
    }

    /* =========================================================
       7. PROJECT SECTIONS & COMPACT / EXPANDABLE LISTS
       ========================================================= */
    .projects-container {
      display: grid;
    }

    .project {
      display: grid;
      gap: 20px;
    }

    .project + .project {
      position: relative;
      margin-top: 64px;
      padding-top: 48px;
      border-top: 0;
    }

    .project + .project::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;

      background:
        linear-gradient(
          90deg,
          transparent 0%,
          rgba(238,233,223,.07) 4%,
          rgba(238,233,223,.095) 36%,
          rgba(238,233,223,.065) 78%,
          transparent 100%
        );
    }

    @media (max-width: 639px) {
      .project + .project {
        margin-top: 56px;
        padding-top: 40px;
      }
    }

    .project-header {
      display: grid;
      gap: 6px;
    }

    .project-eyebrow {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.10em;
      text-transform: uppercase;

      color: var(--accent);
    }

    .project-title {
      font-family: var(--font-display);
      font-size: 26px;
      font-weight: 500;
      font-optical-sizing: auto;
      line-height: 1.01;
      letter-spacing: -0.014em;
      max-width: 20ch;

      color: var(--text-primary);
    }

    .project-summary {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;

      font-size: 14px;
      font-weight: 400;
      line-height: 1.4;

      color: var(--text-muted);
    }

    .project-task-area {
      display: grid;
    }

    .project-focus-label {
      margin: 0 0 9px;

      font-family: var(--font-ui);
      font-size: 11px;
      font-weight: 600;
      line-height: 1;

      letter-spacing: 0.08em;
      text-transform: uppercase;

      color: var(--text-faint);
    }

    .project-toggle-btn {
      appearance: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;

      margin-top: 10px;
      padding: 6px 0;

      font-family: var(--font-ui);
      font-size: 13px;
      font-weight: 500;
      line-height: 1.3;

      color: var(--text-interactive);
      background: transparent;
      border: 0;

      cursor: pointer;
      user-select: none;
      text-decoration: none;

      width: fit-content;

      transition: color var(--transition-fast);
    }

    .project-toggle-btn:hover {
      color: var(--text-primary);
    }

    .project-toggle-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .project-complete {
      margin: 0;
      font-family: var(--font-ui);
      font-size: 14px;
      line-height: 1.45;
      color: var(--text-muted);
    }

    .project-empty {
      margin: 0;
      font-family: var(--font-ui);
      font-size: 14px;
      line-height: 1.45;
      color: var(--text-muted);
    }

    /* =========================================================
       8. TASK LIST & TASK CARDS
       ========================================================= */
    .task-list {
      display: grid;
      gap: 10px;
    }

    .task-card {
      display: grid;
      gap: 12px;

      padding: 22px 24px;

      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,.018),
          rgba(255,255,255,.002) 38%,
          rgba(0,0,0,.018)
        ),
        var(--surface-1);

      border: 1px solid rgba(238,233,223,.075);
      border-radius: var(--radius-card);

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.018),
        inset 0 -1px 0 rgba(0,0,0,.22);

      transition:
        border-color var(--transition-fast),
        background-color var(--transition-fast);
    }

    .task-card:hover {
      border-color: var(--border-strong);
      background-color: var(--surface-2);
    }

    .task-card--located {
      border-color: var(--accent) !important;
      box-shadow: 0 0 0 1px var(--accent);
      transition: box-shadow 400ms ease, border-color 400ms ease;
    }

    .task-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
    }

    .task-title {
      font-family: var(--font-ui);
      font-size: 17px;
      font-weight: 600;
      line-height: 1.35;

      color: var(--text-primary);
    }

    .task-edit {
      appearance: none;
      border: 0;
      padding: 0;

      font-family: var(--font-ui);
      font-size: 13px;
      font-weight: 500;
      line-height: 1;

      color: var(--text-interactive);
      background: transparent;

      cursor: pointer;
      text-decoration: none;

      flex-shrink: 0;

      transition: color var(--transition-fast);
    }

    .task-edit:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    .task-description {
      font-size: 15px;
      font-weight: 400;
      line-height: 1.5;

      color: var(--text-secondary);
    }

    .task-footer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;

      font-size: 13px;
      font-weight: 400;
      line-height: 1.4;

      color: var(--text-muted);
    }

    .task-meta-item {
      display: inline-flex;
      align-items: center;
    }

    .task-attention {
      display: inline-flex;
      align-items: center;

      font-size: 13px;
      font-weight: 500;
      line-height: 1.4;

      color: var(--danger);
    }

    /* =========================================================
       9. IN-CARD VERTICAL EDIT MODE
       ========================================================= */
    .task-edit-form {
      display: grid;
      gap: 14px;
      width: 100%;
    }

    .edit-attribution {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: var(--text-muted);
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .edit-attribution-switch {
      background: none;
      border: none;
      color: var(--accent);
      cursor: pointer;
      font-family: var(--font-ui);
      font-size: 12px;
      padding: 0;
    }
    .edit-attribution-switch:hover {
      text-decoration: underline;
    }

    .edit-group {
      display: grid;
      gap: 6px;
    }

    .edit-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .edit-field {
      width: 100%;
      padding: 9px 12px;
      font-family: var(--font-ui);
      font-size: 14px;
      color: var(--text-primary);
      background-color: var(--surface-2);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-control);
      outline: none;
      transition: border-color var(--transition-fast);
    }

    .edit-field:focus {
      border-color: var(--accent);
    }

    .edit-field--textarea {
      resize: vertical;
      min-height: 70px;
    }

    .edit-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 480px) {
      .edit-row {
        grid-template-columns: 1fr;
      }
    }

    .edit-select {
      width: 100%;
      padding: 9px 12px;
      font-family: var(--font-ui);
      font-size: 14px;
      color: var(--text-primary);
      background-color: var(--surface-2);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-control);
      outline: none;
      cursor: pointer;
    }

    .edit-select:focus {
      border-color: var(--accent);
    }

    .edit-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
      margin-top: 6px;
    }

    .cancel-button {
      padding: 8px 16px;
      font-family: var(--font-ui);
      font-size: 14px;
      font-weight: 500;
      color: var(--text-interactive);
      background: transparent;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-control);
      cursor: pointer;
      transition: color var(--transition-fast), border-color var(--transition-fast);
    }

    .cancel-button:hover {
      color: var(--text-primary);
      border-color: var(--border-strong);
    }

    .save-button {
      padding: 8px 18px;
      font-family: var(--font-ui);
      font-size: 14px;
      font-weight: 500;
      color: #141310;
      background: var(--accent);
      border: 1px solid var(--accent);
      border-radius: var(--radius-control);
      cursor: pointer;
      transition: background-color var(--transition-fast);
    }

    .save-button:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .save-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* =========================================================
       10. PENDING REVIEW & RESOLUTION NOTICES
       ========================================================= */
    .task-pending-review {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border-subtle);
      font-size: 13px;
      color: var(--text-muted);
    }

    .task-pending-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .task-pending-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .task-pending-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
    }

    .task-pending-dot--conflict {
      background: var(--danger);
    }

    .badge-conflict {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 4px;
      background: rgba(207, 119, 110, 0.15);
      color: var(--danger);
      border: 1px solid rgba(207, 119, 110, 0.3);
      margin-left: 6px;
    }

    .task-pending-actions {
      display: inline-flex;
      gap: 12px;
      align-items: center;
    }

    .btn-link {
      background: none;
      border: none;
      color: var(--text-interactive);
      font-size: 12px;
      font-family: var(--font-ui);
      cursor: pointer;
      padding: 0;
    }
    .btn-link:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    .btn-link--danger {
      color: var(--danger);
    }
    .btn-link--danger:hover {
      color: #e08b83;
    }

    .task-pending-details {
      margin-top: 8px;
      padding: 10px 12px;
      background: var(--surface-2);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-control);
      font-size: 12px;
      line-height: 1.5;
      color: var(--text-secondary);
    }

    .task-resolution-notice {
      margin-top: 12px;
      padding: 8px 12px;
      background: rgba(130, 155, 122, 0.08);
      border: 1px solid rgba(130, 155, 122, 0.2);
      border-radius: var(--radius-control);
      font-size: 12px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .task-resolution-dismiss {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 16px;
      padding: 0 4px;
      line-height: 1;
    }
    .task-resolution-dismiss:hover {
      color: var(--text-primary);
    }

    /* =========================================================
       11. ACTOR CLAIM MODAL
       ========================================================= */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(10, 9, 8, 0.78);
      backdrop-filter: blur(4px);
      padding: 16px;
    }

    .modal-card {
      width: 100%;
      max-width: 440px;
      background: var(--surface-1);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-card);
      padding: 26px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
    }

    .modal-title {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .modal-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.4;
      margin-bottom: 20px;
    }

    .actor-choices {
      display: grid;
      gap: 8px;
      margin-bottom: 20px;
    }

    .actor-choice-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 11px 14px;
      background: var(--surface-2);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-control);
      color: var(--text-primary);
      font-family: var(--font-ui);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: border-color var(--transition-fast), background var(--transition-fast);
    }

    .actor-choice-btn:hover {
      background: var(--surface-3);
      border-color: var(--accent);
    }

    .actor-choice-role {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: capitalize;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
    }

    /* Toast Notification */
    .toast-notice {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 99999;
      padding: 12px 18px;
      background: var(--surface-2);
      border: 1px solid var(--accent);
      border-radius: var(--radius-card);
      color: var(--text-primary);
      font-size: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      animation: fadeIn 200ms ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .loading-notice {
      padding: 32px 0;
      font-size: 15px;
      color: var(--text-muted);
    }
  </style>
</head>

<body>
  <main class="page-shell">
    <!-- Application Header -->
    <header class="app-header">
      <div class="app-header__top">
        <h1 class="app-header__title">Student Action Plan</h1>
        <div id="header-context" class="app-header__context">Loading tasks…</div>
      </div>

      <div class="app-header__meta-row">
        <!-- Student Selector Chips -->
        <nav class="app-header__controls" aria-label="Student Selection">
          <button
            type="button"
            id="choice-peter"
            class="choice-chip"
            onclick="selectStudent('PETER-KIM')"
          >
            Peter Kim
          </button>
          <button
            type="button"
            id="choice-paul"
            class="choice-chip"
            onclick="selectStudent('PAUL-KIM')"
          >
            Paul Kim
          </button>
          <button
            type="button"
            id="choice-custom"
            class="choice-chip choice-chip--ghost"
            onclick="toggleCustomStudentPrompt()"
          >
            + Select student
          </button>
          <div id="custom-student-container" style="display: none;" class="custom-student-form">
            <input
              type="text"
              id="custom-student-input"
              class="custom-student-input"
              placeholder="Student ID or Name…"
              onkeydown="if(event.key==='Enter') handleCustomStudentLoad()"
            />
            <button type="button" class="choice-chip" onclick="handleCustomStudentLoad()">Load</button>
          </div>
        </nav>

        <!-- Claimed Actor Status -->
        <div id="header-actor-container" class="app-header__actor-tag" style="display: none;">
          <span>Claimed as: <strong id="header-actor-name" style="color: var(--text-primary);"></strong></span>
          <button type="button" class="actor-tag-btn" onclick="openActorModal()">(Switch)</button>
        </div>
      </div>
    </header>

    <!-- Global Next Action Container -->
    <div id="global-next-action-container" style="display: none;"></div>

    <!-- Projects and Task Lists -->
    <div id="projects-container" class="projects-container">
      <div class="loading-notice">Loading projects and tasks…</div>
    </div>
  </main>

  <!-- Actor Selection Modal -->
  <div id="actor-modal" class="modal-backdrop" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="actor-modal-title">
    <div class="modal-card">
      <h3 id="actor-modal-title" class="modal-title">Who is making this edit?</h3>
      <p class="modal-subtitle">Select your name so your edit proposal is attributed accurately in the review queue.</p>
      <div id="actor-choices" class="actor-choices">
        <!-- Dynamic list of buttons from availableActors -->
      </div>
      <div class="modal-actions">
        <button type="button" class="cancel-button" onclick="closeActorModal()">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    /* =========================================================
       CONFIG & APPLICATION STATE
       ========================================================= */
    const CONFIG = {
      appwriteEndpoint: "https://sgp.cloud.appwrite.io/v1",
      appwriteProjectId: "6aa56fc2003426215b61",
      databaseId: "student_hub",
      scriptUrl: "https://script.google.com/macros/s/AKfycbzWe6R8blq8XX85GkCRv-ngPAWQZatlcUGABdYNCb1XRc1RZsoFS2auQYDYMQPoqOcPlw/exec"
    };

    const urlParams = new URLSearchParams(window.location.search);
    const initialStudent = urlParams.get("student") || localStorage.getItem("sap_active_student") || "PETER-KIM";

    const state = {
      currentStudent: initialStudent.trim().toUpperCase(),
      projects: [],
      rawTodos: [],
      pendingRequests: [],
      recentResolutions: [],
      availableActors: [],
      availableOwners: [],
      availableStudents: [],
      lastUpdated: null,
      editingTaskId: null,
      pendingDetailsOpen: new Set(),
      submittingTaskId: null,
      expandedProjects: new Set()
    };

    /* =========================================================
       ACTOR CLAIM MANAGEMENT (sessionStorage)
       ========================================================= */
    function getClaimedActor() {
      try {
        const raw = sessionStorage.getItem("sap_claimed_actor");
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (parsed && (parsed.id === "STF-HYEYOUNG" || String(parsed.label || "").toLowerCase().includes("hyeyoung"))) {
          sessionStorage.removeItem("sap_claimed_actor");
          return null;
        }
        return parsed;
      } catch (e) {
        return null;
      }
    }

    function setClaimedActor(actor) {
      if (actor && actor.id !== "STF-HYEYOUNG" && !String(actor.label || "").toLowerCase().includes("hyeyoung")) {
        sessionStorage.setItem("sap_claimed_actor", JSON.stringify(actor));
      } else {
        sessionStorage.removeItem("sap_claimed_actor");
      }
      updateActorHeaderDisplay();
    }

    function updateActorHeaderDisplay() {
      const actor = getClaimedActor();
      const container = document.getElementById("header-actor-container");
      const nameEl = document.getElementById("header-actor-name");
      if (!container || !nameEl) return;

      if (actor && actor.label) {
        nameEl.textContent = actor.label;
        container.style.display = "flex";
      } else {
        container.style.display = "none";
      }
    }

    function getActorRoleLabel(actor) {
      const label = String(actor.label || "").trim().toLowerCase();
      const id = String(actor.id || "").trim().toUpperCase();
      if (id === "PTR-JOSH-RAGBIR" || label.includes("josh")) return "Counselor";
      if (actor.type === "student" || label === "peter kim" || label === "paul kim" || id.startsWith("STU-")) return "Student";
      return "Collaborator";
    }

    function openActorModal(onSelected) {
      onActorSelectedCallback = onSelected || null;
      const modal = document.getElementById("actor-modal");
      const choicesContainer = document.getElementById("actor-choices");
      if (!modal || !choicesContainer) return;

      choicesContainer.innerHTML = "";

      const rawActors = state.availableActors.length > 0 ? state.availableActors : [
        { type: "student", id: "STU-001", label: "Peter Kim" },
        { type: "student", id: "STU-002", label: "Paul Kim" },
        { type: "staff", id: "PTR-JOSH-RAGBIR", label: "Josh Ragbir" },
        { type: "staff", id: "STF-KANGHO", label: "Kangho Kim" }
      ];

      // Strict Deduplication & Hyeyoung Kim purge
      const seen = new Set();
      const actors = [];
      rawActors.forEach(a => {
        const lbl = String(a.label || "").trim();
        const id = String(a.id || "").trim();
        const key = lbl.toLowerCase();
        if (!lbl || id === "STF-HYEYOUNG" || key === "hyeyoung kim") return;
        if (!seen.has(key)) {
          seen.add(key);
          actors.push(a);
        }
      });

      actors.forEach(actor => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "actor-choice-btn";
        btn.onclick = () => {
          setClaimedActor(actor);
          closeActorModal();
          if (onActorSelectedCallback) {
            onActorSelectedCallback(actor);
            onActorSelectedCallback = null;
          }
          if (state.editingTaskId) {
            renderProjects();
          }
        };

        const nameSpan = document.createElement("span");
        nameSpan.textContent = actor.label;

        const roleSpan = document.createElement("span");
        roleSpan.className = "actor-choice-role";
        roleSpan.textContent = getActorRoleLabel(actor);

        btn.append(nameSpan, roleSpan);
        choicesContainer.appendChild(btn);
      });

      modal.style.display = "flex";
    }

    function closeActorModal() {
      const modal = document.getElementById("actor-modal");
      if (modal) modal.style.display = "none";
      onActorSelectedCallback = null;
    }

    /* In-memory & session cache for instant (0ms) Stale-While-Revalidate navigation */
    const clientCache = new Map();

    function applyStudentData(data, studentId) {
      if (!data || studentId !== state.currentStudent) return;
      state.lastUpdated = data.lastUpdated ? new Date(data.lastUpdated) : new Date();
      state.pendingRequests = Array.isArray(data.pendingRequests) ? data.pendingRequests : [];
      state.recentResolutions = Array.isArray(data.recentResolutions) ? data.recentResolutions : [];
      state.availableActors = Array.isArray(data.availableActors) ? data.availableActors : [];
      state.availableOwners = Array.isArray(data.availableOwners) ? data.availableOwners : [];
      state.availableStudents = Array.isArray(data.availableStudents) ? data.availableStudents : [];

      parseProjects(data);
      updateHeaderContext();
      updateActorHeaderDisplay();
      renderProjects();
    }

    function selectStudent(studentId) {
      const normalized = studentId.trim().toUpperCase();
      state.currentStudent = normalized;
      state.editingTaskId = null;
      state.expandedProjects.clear();
      localStorage.setItem("sap_active_student", state.currentStudent);

      const url = new URL(window.location.href);
      url.searchParams.set("student", state.currentStudent);
      window.history.pushState({}, "", url);

      updateStudentButtons();

      // If cached data exists, render IMMEDIATELY (0ms latency)
      if (clientCache.has(normalized)) {
        applyStudentData(clientCache.get(normalized), normalized);
      } else {
        // Clean slate only on cold cache
        const globalContainer = document.getElementById("global-next-action-container");
        if (globalContainer) {
          globalContainer.innerHTML = "";
          globalContainer.style.display = "none";
        }

        const headerContext = document.getElementById("header-context");
        if (headerContext) {
          headerContext.textContent = "Loading tasks…";
        }

        const container = document.getElementById("projects-container");
        if (container) {
          container.innerHTML = `<div class="loading-notice">Loading projects and tasks…</div>`;
        }
      }

      // Background revalidate from Appwrite Cloud (sub-50ms)
      fetchPlan();
    }

    function updateStudentButtons() {
      const isPeter = state.currentStudent === "PETER-KIM";
      const isPaul = state.currentStudent === "PAUL-KIM";

      const peterBtn = document.getElementById("choice-peter");
      const paulBtn = document.getElementById("choice-paul");

      if (peterBtn) peterBtn.setAttribute("aria-current", isPeter ? "true" : "false");
      if (paulBtn) paulBtn.setAttribute("aria-current", isPaul ? "true" : "false");
    }

    function toggleCustomStudentPrompt() {
      const container = document.getElementById("custom-student-container");
      if (!container) return;
      const isOpen = container.style.display !== "none";
      container.style.display = isOpen ? "none" : "inline-flex";
      if (!isOpen) {
        document.getElementById("custom-student-input")?.focus();
      }
    }

    function handleCustomStudentLoad() {
      const input = document.getElementById("custom-student-input");
      const val = input?.value.trim();
      if (val) {
        selectStudent(val);
        input.value = "";
        toggleCustomStudentPrompt();
      }
    }

    /* =========================================================
       DATA FETCHING VIA APPWRITE CLOUD (SUB-100MS) WITH SWR
       ========================================================= */
    let fetchSeq = 0;

    async function fetchPlan() {
      const thisSeq = ++fetchSeq;
      const targetStudent = state.currentStudent;
      const container = document.getElementById("projects-container");
      if (!container) return;
      
      if (!clientCache.has(targetStudent) && state.projects.length === 0) {
        container.innerHTML = `<div class="loading-notice">Loading projects and tasks…</div>`;
      }

      try {
        // Direct parallel query to Appwrite Database (Indexed MariaDB, sub-100ms)
        const appwriteHeaders = { "X-Appwrite-Project": CONFIG.appwriteProjectId };
        const base = `${CONFIG.appwriteEndpoint}/databases/${CONFIG.databaseId}/collections`;

        const [wiRes, stuRes, stfRes, rqRes, briefRes] = await Promise.all([
          fetch(`${base}/work_items/documents?limit=100`, { headers: appwriteHeaders }),
          fetch(`${base}/students/documents`, { headers: appwriteHeaders }),
          fetch(`${base}/staff/documents`, { headers: appwriteHeaders }),
          fetch(`${base}/review_queue/documents?limit=100`, { headers: appwriteHeaders }),
          fetch(`${base}/agent_updates/documents?limit=1`, { headers: appwriteHeaders }).catch(() => null)
        ]);

        if (!wiRes.ok) throw new Error(`Appwrite DB returned HTTP ${wiRes.status}`);

        const [wiData, stuData, stfData, rqData] = await Promise.all([
          wiRes.json(),
          stuRes.json(),
          stfRes.json(),
          rqRes.json()
        ]);

        let actionBrief = null;
        if (briefRes && briefRes.ok) {
          try {
            const bJson = await briefRes.json();
            if (bJson.documents && bJson.documents.length > 0 && bJson.documents[0].action_brief_json) {
              actionBrief = JSON.parse(bJson.documents[0].action_brief_json);
            }
          } catch (bErr) {}
        }

        const allStudents = (stuData.documents || []).map(d => ({
          studentId: d.student_id,
          displayName: d.display_name,
          status: d.student_status || "ACTIVE"
        }));

        const staffList = (stfData.documents || []).map(d => ({
          id: d.staff_id,
          label: d.display_name,
          type: "staff",
          roleCategory: d.role_category || "Collaborator"
        }));

        const availableActors = [
          ...allStudents.map(s => ({ type: "student", id: s.studentId, label: s.displayName, roleCategory: "Student" })),
          ...staffList.map(st => ({ type: "staff", id: st.id, label: st.label, roleCategory: st.roleCategory }))
        ];

        const availableOwners = [
          { group: "Students", options: allStudents.map(s => ({ value: "student:" + s.studentId, label: s.displayName, type: "student", id: s.studentId })) },
          { group: "Counselor", options: staffList.filter(s => s.roleCategory === "Counselor").map(s => ({ value: "staff:" + s.id, label: s.label, type: "staff", id: s.id })) },
          { group: "Collaborators", options: staffList.filter(s => s.roleCategory !== "Counselor").map(s => ({ value: "staff:" + s.id, label: s.label, type: "staff", id: s.id })) },
          { group: "Roles & Family Labels", options: [{ value: "label:Parent (General)", label: "Parent (General)" }, { value: "label:Paul's Dad", label: "Paul's Dad" }, { value: "label:Peter's Dad", label: "Peter's Dad" }] }
        ];

        const cleanStudent = targetStudent.trim().toUpperCase();

        const todos = (wiData.documents || []).map(d => ({
          workItemId: d.work_item_id,
          projectId: d.project_id,
          studentId: d.student_id,
          projectName: d.project_name,
          itemType: d.item_type || "ACTION",
          title: d.title,
          itemStatus: d.item_status,
          priority: d.priority,
          ownerStaffId: d.owner_staff_id,
          ownerStudentId: d.owner_student_id,
          ownerLabel: d.owner_label,
          dueDate: d.due_date,
          dependsOnWorkItemId: d.depends_on_work_item_id,
          waitingOn: d.waiting_on,
          notes: d.notes,
          completionCriteria: d.completion_criteria,
          evidenceUrl: d.evidence_url,
          nextReviewDate: d.next_review_date,
          completedAt: d.completed_at,
          updatedAt: d.updated_at
        })).filter(t => {
          if (!cleanStudent || cleanStudent === "ALL") return true;
          const tStu = String(t.studentId || "").toUpperCase();
          return tStu === cleanStudent || tStu.includes(cleanStudent) || (cleanStudent === "PETER-KIM" && tStu === "STU-001") || (cleanStudent === "PAUL-KIM" && tStu === "STU-002");
        });

        const pendingRequests = [];
        const recentResolutions = [];
        const fortyEightHoursMs = 48 * 60 * 60 * 1000;
        const nowTime = Date.now();

        (rqData.documents || []).forEach(r => {
          let envelope = {};
          try {
            envelope = JSON.parse(r.proposed_value || "{}");
          } catch (e) {}

          const assignedStu = String(r.assigned_student_id || envelope.studentId || "").toUpperCase();
          const matchStudent = !cleanStudent || cleanStudent === "ALL" || assignedStu === cleanStudent || assignedStu.includes(cleanStudent) || (cleanStudent === "PETER-KIM" && assignedStu === "STU-001") || (cleanStudent === "PAUL-KIM" && assignedStu === "STU-002");
          if (!matchStudent) return;

          const rStatus = String(r.review_status || "open").toUpperCase();
          const isOpen = (rStatus === "OPEN" || rStatus === "PENDING_REVIEW" || rStatus === "IN_REVIEW" || rStatus === "CONFLICT");
          const isClosed = (rStatus === "RESOLVED" || rStatus === "APPLIED" || rStatus === "IGNORED" || rStatus === "DISMISSED");

          if (isOpen) {
            pendingRequests.push({
              reviewId: r.review_id,
              workItemId: r.entity_id,
              entityType: r.entity_type,
              status: envelope.status || (rStatus === "OPEN" ? "PENDING_REVIEW" : rStatus),
              priority: envelope.priority || (String(r.review_priority).toUpperCase() === "HIGH" ? "HIGH" : "NORMAL"),
              question: r.question,
              reason: r.reason,
              createdAt: r.created_at,
              actor: envelope.actor || null,
              changes: envelope.changes || {},
              baseUpdatedAt: envelope.baseUpdatedAt || null
            });
          } else if (isClosed) {
            let isRecent = true;
            if (r.resolved_at) {
              const resTime = new Date(r.resolved_at).getTime();
              if (!isNaN(resTime) && (nowTime - resTime > fortyEightHoursMs)) isRecent = false;
            }
            if (isRecent) {
              recentResolutions.push({
                reviewId: r.review_id,
                workItemId: r.entity_id,
                entityType: r.entity_type,
                status: (rStatus === "RESOLVED" || rStatus === "APPLIED") ? "APPLIED" : "DISMISSED",
                resolvedAt: r.resolved_at,
                resolvedBy: r.resolved_by,
                resolution: r.resolution,
                approvedChanges: envelope.changes || envelope.approvedChanges || {}
              });
            }
          }
        });

        const unifiedData = {
          status: "ok",
          student: cleanStudent,
          availableStudents: allStudents,
          availableActors: availableActors,
          availableOwners: availableOwners,
          todos: todos,
          pendingRequests: pendingRequests,
          recentResolutions: recentResolutions,
          lastUpdated: new Date().toISOString(),
          actionBrief: actionBrief
        };
        
        // Cache data for instant switches
        clientCache.set(targetStudent, unifiedData);

        // Discard stale response if user switched away during in-flight fetch
        if (thisSeq !== fetchSeq || targetStudent !== state.currentStudent) return;

        // Apply fresh data
        applyStudentData(unifiedData, targetStudent);

      } catch (err) {
        if (thisSeq !== fetchSeq) return;
        console.warn("Appwrite direct fetch error, falling back to GAS:", err);
        
        // Fallback to Google Apps Script if Appwrite is unavailable
        try {
          const gasUrl = `${CONFIG.scriptUrl}?student=${encodeURIComponent(targetStudent)}&_t=${Date.now()}`;
          const gasRes = await fetch(gasUrl, { cache: "no-store" });
          if (gasRes.ok) {
            const gasData = await gasRes.json();
            clientCache.set(targetStudent, gasData);
            if (thisSeq === fetchSeq && targetStudent === state.currentStudent) {
              applyStudentData(gasData, targetStudent);
            }
            return;
          }
        } catch (gasErr) {
          console.error("GAS fallback error:", gasErr);
        }

        if (!clientCache.has(targetStudent) && state.projects.length === 0) {
          container.innerHTML = `
            <div class="loading-notice">
              Unable to load data. Please check connection.
              <button type="button" class="choice-chip" style="margin-left: 10px; display: inline-flex; vertical-align: middle;" onclick="fetchPlan()">Retry</button>
            </div>
          `;
        }
      }
    }

    function schedulePrefetches(data) {
      const studentsToPrefetch = ["PETER-KIM", "PAUL-KIM"];
      if (Array.isArray(data.availableStudents)) {
        data.availableStudents.forEach(s => {
          if (s.studentId && !studentsToPrefetch.includes(s.studentId.toUpperCase())) {
            studentsToPrefetch.push(s.studentId.toUpperCase());
          }
        });
      }

      studentsToPrefetch.forEach((sId, index) => {
        if (sId !== state.currentStudent && !clientCache.has(sId)) {
          setTimeout(() => prefetchStudent(sId), (index + 1) * 600);
        }
      });
    }

    async function prefetchStudent(studentId) {
      if (clientCache.has(studentId)) return;
      try {
        const url = `${CONFIG.scriptUrl}?student=${encodeURIComponent(studentId)}&_t=${Date.now()}`;
        const res = await fetch(url, { cache: "no-store" });
        if (res.ok) {
          const data = await res.json();
          clientCache.set(studentId, data);
        }
      } catch (e) {
        // Silent background prefetch fail is benign
      }
    }

    function parseProjects(data) {
      let projectList = [];

      if (data.actionBrief && Array.isArray(data.actionBrief.projects)) {
        projectList = data.actionBrief.projects.map(p => {
          const tasks = [
            ...(p.roles?.student || []),
            ...(p.roles?.parent || []),
            ...(p.roles?.me || [])
          ];
          return {
            projectId: p.projectId,
            projectName: p.projectName,
            categoryCode: p.categoryCode || "",
            projectStatus: p.projectStatus || "active",
            targetDate: p.targetDate || "",
            notes: p.notes || "",
            tasks: tasks
          };
        });
      } else {
        const allTodos = Array.isArray(data.todos) ? data.todos : [];
        const map = new Map();
        allTodos.forEach(t => {
          const pId = t.projectId || "PRJ-GENERAL";
          if (!map.has(pId)) {
            map.set(pId, {
              projectId: pId,
              projectName: t.projectName || "General",
              categoryCode: "",
              projectStatus: "active",
              targetDate: "",
              notes: "",
              tasks: []
            });
          }
          map.get(pId).tasks.push(t);
        });
        projectList = Array.from(map.values());
      }

      state.projects = projectList;
    }

    function updateHeaderContext() {
      let totalOpenTasks = 0;
      state.projects.forEach(p => {
        totalOpenTasks += getProjectActiveTasks(p.tasks).length;
      });
      const timeString = formatClockTime(state.lastUpdated);
      const headerContext = document.getElementById("header-context");
      if (headerContext) {
        headerContext.textContent = `${totalOpenTasks} open task${totalOpenTasks === 1 ? "" : "s"} · Updated ${timeString}`;
      }
    }

    /* =========================================================
       NEXT ACTION RANKING & SELECTION ENGINE
       ========================================================= */
    function normalizeStatus(status) {
      const s = String(status || "").trim().toUpperCase().replace(/[\s-]+/g, "_");
      if (s === "COMPLETE" || s === "COMPLETED") return "DONE";
      return s || "READY";
    }

    function isDependencyResolved(task, tasksById) {
      const depId = String(task.dependsOnWorkItemId || "").trim();
      if (!depId) return true;
      const depTask = tasksById.get(depId);
      if (!depTask) return true;
      return normalizeStatus(depTask.itemStatus) === "DONE";
    }

    function getNextAction(tasks) {
      if (!tasks || !tasks.length) return null;
      const tasksById = new Map(tasks.map(t => [t.workItemId, t]));

      const actionable = tasks.filter(t => {
        const st = normalizeStatus(t.itemStatus);
        if (st !== "READY" && st !== "IN_PROGRESS" && st !== "REVIEW") return false;
        if (String(t.waitingOn || "").trim()) return false;
        return isDependencyResolved(t, tasksById);
      });

      if (actionable.length === 0) return null;

      actionable.sort((a, b) => {
        // 1. Due date (earliest first; tasks with due date before tasks without)
        const aDate = a.dueDate ? new Date(a.dueDate).getTime() : Infinity;
        const bDate = b.dueDate ? new Date(b.dueDate).getTime() : Infinity;
        if (aDate !== bDate) return aDate - bDate;

        // 2. Priority: URGENT (3), HIGH (2), NORMAL (1), LOW (0)
        const prioRank = { "URGENT": 3, "HIGH": 2, "NORMAL": 1, "LOW": 0 };
        const aPrio = prioRank[String(a.priority || "NORMAL").toUpperCase()] || 1;
        const bPrio = prioRank[String(b.priority || "NORMAL").toUpperCase()] || 1;
        if (aPrio !== bPrio) return bPrio - aPrio;

        // 3. Status: IN_PROGRESS (3), READY (2), REVIEW (1)
        const statusRank = { "IN_PROGRESS": 3, "READY": 2, "REVIEW": 1 };
        const aSt = statusRank[normalizeStatus(a.itemStatus)] || 0;
        const bSt = statusRank[normalizeStatus(b.itemStatus)] || 0;
        if (aSt !== bSt) return bSt - aSt;

        return 0;
      });

      return actionable[0];
    }

    function getPrimaryBlocker(tasks) {
      if (!tasks || !tasks.length) return null;
      const tasksById = new Map(tasks.map(t => [t.workItemId, t]));

      const blocked = tasks.filter(t => {
        const st = normalizeStatus(t.itemStatus);
        if (st === "DONE" || st === "ARCHIVED") return false;
        return st === "WAITING" || Boolean(String(t.waitingOn || "").trim()) || !isDependencyResolved(t, tasksById);
      });

      if (blocked.length === 0) return null;

      blocked.sort((a, b) => {
        const aDate = a.dueDate ? new Date(a.dueDate).getTime() : Infinity;
        const bDate = b.dueDate ? new Date(b.dueDate).getTime() : Infinity;
        if (aDate !== bDate) return aDate - bDate;
        return 0;
      });

      return blocked[0];
    }

    function getPrimaryPlannedTask(tasks) {
      if (!tasks || !tasks.length) return null;
      const planned = tasks.filter(t => normalizeStatus(t.itemStatus) === "PLANNED");
      if (planned.length === 0) return null;

      planned.sort((a, b) => {
        const aDate = a.dueDate ? new Date(a.dueDate).getTime() : Infinity;
        const bDate = b.dueDate ? new Date(b.dueDate).getTime() : Infinity;
        if (aDate !== bDate) return aDate - bDate;
        return 0;
      });

      return planned[0];
    }

    function getProjectFocusTask(projectTasks) {
      return getNextAction(projectTasks)
        || getPrimaryBlocker(projectTasks)
        || getPrimaryPlannedTask(projectTasks)
        || null;
    }

    function getProjectActiveTasks(tasks) {
      return (tasks || []).filter(task => {
        const status = normalizeStatus(task.itemStatus);
        return (
          status !== "DONE" &&
          status !== "ARCHIVED"
        );
      });
    }

    function orderExpandedProjectTasks(activeTasks, focusTask) {
      if (!focusTask) {
        return activeTasks;
      }

      return [
        focusTask,
        ...activeTasks.filter(
          task => task.workItemId !== focusTask.workItemId
        )
      ];
    }

    function getProjectFocusLabel(projectTasks, focusTask) {
      if (!focusTask) {
        return "";
      }

      const status = normalizeStatus(focusTask.itemStatus);

      const tasksById = new Map(
        projectTasks.map(task => [
          task.workItemId,
          task
        ])
      );

      const blocked =
        status === "WAITING" ||
        Boolean(String(focusTask.waitingOn || "").trim()) ||
        !isDependencyResolved(focusTask, tasksById);

      if (blocked) {
        return "Current blocker";
      }

      if (status === "PLANNED") {
        return "Up next";
      }

      return "Next in this project";
    }

    function getMoreTasksLabel(count) {
      if (count === 1) {
        return "Show 1 more task";
      }
      return `Show ${count} more tasks`;
    }

    function toggleProjectExpansion(projectId) {
      if (state.expandedProjects.has(projectId)) {
        state.expandedProjects.delete(projectId);
      } else {
        state.expandedProjects.add(projectId);
      }
      renderProjects();
    }

    function sanitizeDomId(str) {
      return String(str || "").replace(/[^a-zA-Z0-9_-]/g, "_");
    }

    function renderProjectTerminalState(projectTasks) {
      const nonArchived = (projectTasks || []).filter(task =>
        normalizeStatus(task.itemStatus) !== "ARCHIVED"
      );

      if (!nonArchived.length) {
        return {
          type: "empty",
          text: "No tasks yet"
        };
      }

      const allDone = nonArchived.every(task =>
        normalizeStatus(task.itemStatus) === "DONE"
      );

      if (allDone) {
        return {
          type: "complete",
          text: "All tasks complete"
        };
      }

      return null;
    }

    /* =========================================================
       GLOBAL NEXT ACTION RENDERING & OPEN ACTION
       ========================================================= */
    function renderGlobalNextAction() {
      const container = document.getElementById("global-next-action-container");
      if (!container) return;

      // Collect all tasks across projects
      const allTasks = [];
      state.projects.forEach(p => {
        (p.tasks || []).forEach(t => {
          allTasks.push(Object.assign({ projectName: p.projectName }, t));
        });
      });

      const nextAction = getNextAction(allTasks);
      if (!nextAction) {
        container.innerHTML = "";
        container.style.display = "none";
        return;
      }

      container.style.display = "block";
      container.innerHTML = `
        <section class="global-next-action" aria-label="Global Next Action">
          <div class="global-next-action__eyebrow">Next Action</div>
          <div class="global-next-action__card">
            <div class="global-next-action__content">
              <h2 class="global-next-action__title">${escapeHtml(nextAction.title)}</h2>
              <div class="global-next-action__meta">
                <span>${escapeHtml(nextAction.projectName || "General")}</span>
                <span aria-hidden="true">·</span>
                ${nextAction.dueDate ? `<span>Due ${formatShortMonthDay(nextAction.dueDate)}</span><span aria-hidden="true">·</span>` : ""}
                <span>${formatLifecycleStatus(nextAction.itemStatus)}</span>
                ${resolveOwnerText(nextAction) ? `<span aria-hidden="true">·</span><span>${escapeHtml(resolveOwnerText(nextAction))}</span>` : ""}
              </div>
            </div>
            <button type="button" class="global-next-action__btn" id="btn-open-global-next">Open task</button>
          </div>
        </section>
      `;

      document.getElementById("btn-open-global-next")?.addEventListener("click", () => {
        revealAndOpenTask(nextAction);
      });
    }

    function revealAndOpenTask(task) {
      const project = state.projects.find(p => p.projectId === task.projectId);
      const focusTask = project ? getProjectFocusTask(project.tasks) : null;
      const isFocusTask = focusTask && focusTask.workItemId === task.workItemId;

      if (!isFocusTask) {
        state.expandedProjects.add(task.projectId);
        renderProjects();
      }

      requestAnimationFrame(() => {
        openRecommendedTask(task.workItemId);
      });
    }

    function openRecommendedTask(workItemId) {
      const card = document.querySelector(`[data-task-id="${workItemId}"]`);
      if (!card) return;

      card.scrollIntoView({ behavior: "smooth", block: "center" });
      card.classList.add("task-card--located");

      const editBtn = card.querySelector(".task-edit") || card;
      if (editBtn && typeof editBtn.focus === "function") {
        editBtn.focus();
      }

      setTimeout(() => {
        card.classList.remove("task-card--located");
      }, 2200);
    }

    /* =========================================================
       PROJECT & CARD RENDERING
       ========================================================= */
    function renderProjects() {
      renderGlobalNextAction();

      const container = document.getElementById("projects-container");
      if (!container) return;

      if (state.projects.length === 0) {
        container.innerHTML = `<div class="loading-notice">No active projects or tasks.</div>`;
        return;
      }

      container.innerHTML = "";

      state.projects.forEach(project => {
        const projectEl = document.createElement("section");
        projectEl.className = "project";
        projectEl.setAttribute("data-project-id", project.projectId);

        // Header
        const header = document.createElement("header");
        header.className = "project-header";

        // Eyebrow
        const eyebrowText = formatCategoryEyebrow(project.categoryCode);
        if (eyebrowText) {
          const eyebrow = document.createElement("div");
          eyebrow.className = "project-eyebrow";
          eyebrow.textContent = eyebrowText;
          header.appendChild(eyebrow);
        }

        // Title
        const title = document.createElement("h2");
        title.className = "project-title";
        title.textContent = project.projectName;
        header.appendChild(title);

        // Summary
        const summary = document.createElement("div");
        summary.className = "project-summary";

        const activeTasks = getProjectActiveTasks(project.tasks);

        const parts = [];
        if (project.targetDate) {
          parts.push(`Target ${formatShortMonthDay(project.targetDate)}`);
        }
        parts.push(`${activeTasks.length} open task${activeTasks.length === 1 ? "" : "s"}`);

        const waitingCount = activeTasks.filter(t => isWaiting(t)).length;
        if (waitingCount > 0) {
          parts.push(`${waitingCount} waiting`);
        }

        parts.forEach((txt, idx) => {
          if (idx > 0) {
            const sep = document.createElement("span");
            sep.setAttribute("aria-hidden", "true");
            sep.textContent = "·";
            summary.appendChild(sep);
          }
          const item = document.createElement("span");
          item.textContent = txt;
          summary.appendChild(item);
        });

        header.appendChild(summary);
        projectEl.appendChild(header);

        // Project Task Area
        const taskArea = document.createElement("div");
        taskArea.className = "project-task-area";

        const focusTask = getProjectFocusTask(project.tasks);
        const expanded = state.expandedProjects.has(project.projectId);

        if (!activeTasks.length) {
          const terminal = renderProjectTerminalState(project.tasks);
          if (terminal) {
            const pEl = document.createElement("p");
            pEl.className = terminal.type === "empty" ? "project-empty" : "project-complete";
            pEl.textContent = terminal.text;
            taskArea.appendChild(pEl);
          }
        } else {
          const labelText = getProjectFocusLabel(project.tasks, focusTask);
          if (labelText) {
            const focusLabel = document.createElement("p");
            focusLabel.className = "project-focus-label";
            focusLabel.textContent = labelText;
            taskArea.appendChild(focusLabel);
          }

          const orderedTasks = orderExpandedProjectTasks(activeTasks, focusTask);
          const visibleTasks = expanded ? orderedTasks : (focusTask ? [focusTask] : []);

          const safeId = sanitizeDomId(project.projectId);
          const taskList = document.createElement("div");
          taskList.className = "task-list";
          taskList.id = `project-tasks-${safeId}`;
          taskList.setAttribute("data-project-task-list", "");

          visibleTasks.forEach(task => {
            taskList.appendChild(renderTaskCard(task, project.projectId));
          });

          taskArea.appendChild(taskList);

          const additionalCount = Math.max(activeTasks.length - 1, 0);
          if (additionalCount > 0) {
            const toggleBtn = document.createElement("button");
            toggleBtn.type = "button";
            toggleBtn.className = "project-more";
            toggleBtn.setAttribute("data-project-toggle", "");
            toggleBtn.setAttribute("aria-expanded", expanded ? "true" : "false");
            toggleBtn.setAttribute("aria-controls", `project-tasks-${safeId}`);
            toggleBtn.textContent = expanded ? "Show fewer tasks" : getMoreTasksLabel(additionalCount);
            toggleBtn.onclick = () => toggleProjectExpansion(project.projectId);
            taskArea.appendChild(toggleBtn);
          }
        }

        projectEl.appendChild(taskArea);
        container.appendChild(projectEl);
      });
    }

    function renderTaskCard(task, projectId) {
      const card = document.createElement("article");
      card.className = "task-card";
      card.setAttribute("data-task-id", task.workItemId);

      const isEditing = state.editingTaskId === task.workItemId;

      if (isEditing) {
        return renderTaskEditForm(task, projectId, card);
      }

      // Normal Card View
      const taskHeader = document.createElement("header");
      taskHeader.className = "task-header";

      const title = document.createElement("h3");
      title.className = "task-title";
      title.textContent = task.title;

      const editBtn = document.createElement("button");
      editBtn.className = "task-edit";
      editBtn.type = "button";
      editBtn.textContent = "Edit";
      editBtn.onclick = () => handleEditClick(task.workItemId, projectId);

      taskHeader.append(title, editBtn);
      card.appendChild(taskHeader);

      if (task.notes) {
        const desc = document.createElement("p");
        desc.className = "task-description";
        desc.textContent = task.notes;
        card.appendChild(desc);
      }

      // Footer
      const footer = document.createElement("footer");
      footer.className = "task-footer";

      // 1. Due Date
      if (task.dueDate) {
        const dueMeta = document.createElement("span");
        dueMeta.className = "task-meta-item";
        dueMeta.textContent = `Due ${formatShortMonthDay(task.dueDate)}`;
        footer.appendChild(dueMeta);
      }

      // 2. Lifecycle Status
      const statusMeta = document.createElement("span");
      statusMeta.className = "task-meta-item";
      statusMeta.textContent = formatLifecycleStatus(task.itemStatus);
      footer.appendChild(statusMeta);

      // 3. Owner
      const ownerName = resolveOwnerText(task);
      if (ownerName) {
        const ownerMeta = document.createElement("span");
        ownerMeta.className = "task-meta-item";
        ownerMeta.textContent = ownerName;
        footer.appendChild(ownerMeta);
      }

      // 4. Overdue / Due Attention
      const attentionText = getDueAttention(task.dueDate);
      if (attentionText) {
        const attention = document.createElement("span");
        attention.className = "task-attention";
        attention.textContent = attentionText;
        footer.appendChild(attention);
      }

      card.appendChild(footer);

      // 5. Attached Pending Review Proposal
      const pendingReview = state.pendingRequests.find(r => r.workItemId === task.workItemId);
      if (pendingReview) {
        card.appendChild(renderPendingReviewSection(task, pendingReview));
      }

      // 6. Attached Recent Resolution Notice (if not dismissed)
      const dismissedIds = getDismissedResolutionIds();
      const resolution = state.recentResolutions.find(r => r.workItemId === task.workItemId && !dismissedIds.has(r.reviewId));
      if (resolution && !pendingReview) {
        card.appendChild(renderResolutionNotice(task, resolution));
      }

      return card;
    }

      const actor = getClaimedActor();

      const form = document.createElement("form");
      form.className = "task-edit-form";
      form.onsubmit = (e) => handleSubmitProposal(e, task);

      // Attribution Header
      const attrRow = document.createElement("div");
      attrRow.className = "edit-attribution";
      
      const attrLabel = document.createElement("span");
      attrLabel.innerHTML = `Submitting change as: <strong style="color: var(--text-primary);">${actor ? escapeHtml(actor.label) : "Anonymous"}</strong>`;

      const switchBtn = document.createElement("button");
      switchBtn.type = "button";
      switchBtn.className = "edit-attribution-switch";
      switchBtn.textContent = "(Switch)";
      switchBtn.onclick = () => openActorModal();

      attrRow.append(attrLabel, switchBtn);
      form.appendChild(attrRow);

      // 1. Task Title
      const titleGroup = document.createElement("div");
      titleGroup.className = "edit-group";
      const titleLabel = document.createElement("label");
      titleLabel.className = "edit-label";

      const titleInput = document.createElement("input");
      titleInput.type = "text";
      titleInput.className = "edit-field";
      titleInput.id = `edit-title-${task.workItemId}`;

      titleInput.required = true;
      titleGroup.append(titleLabel, titleInput);

      const descInput = document.createElement("textarea");
      descInput.className = "edit-field edit-field--textarea";
      descInput.id = `edit-desc-${task.workItemId}`;
      descInput.value = task.notes || "";
      descGroup.append(descLabel, descInput);

      // 3. Row for Due Date & Status
      const row = document.createElement("div");
      row.className = "edit-row";

      // Due Date
      const dueGroup = document.createElement("div");
      dueGroup.className = "edit-group";
      const dueLabel = document.createElement("label");
      dueLabel.className = "edit-label";
      dueLabel.textContent = "Due date";
      const dueInput = document.createElement("input");
      dueInput.type = "date";
      dueInput.className = "edit-field";
      dueInput.id = `edit-due-${task.workItemId}`;
      dueInput.value = task.dueDate || "";
      dueGroup.append(dueLabel, dueInput);

      // Status
      const statusGroup = document.createElement("div");
      statusGroup.className = "edit-group";
      const statusLabel = document.createElement("label");
      statusLabel.className = "edit-label";
      statusLabel.textContent = "Status";
      const statusSelect = document.createElement("select");
      statusSelect.className = "edit-select";
      statusSelect.id = `edit-status-${task.workItemId}`;

      const statusOptions = [
        { val: "ready", label: "Ready" },
        { val: "in_progress", label: "In progress" },
        { val: "waiting", label: "Waiting" },
        { val: "planned", label: "Planned" },
        { val: "review", label: "Review" },
        { val: "done", label: "Done" }
      ];

      const curStatus = String(task.itemStatus || "").toLowerCase();
      statusOptions.forEach(opt => {
        const optEl = document.createElement("option");
        optEl.value = opt.val;
        optEl.textContent = opt.label;
        if (curStatus === opt.val || (opt.val === "done" && (curStatus === "complete" || curStatus === "done"))) {
          optEl.selected = true;
        }
        statusSelect.appendChild(optEl);
      });

      statusGroup.append(statusLabel, statusSelect);
      row.append(dueGroup, statusGroup);

      // 4. Owner Select (Grouped)
      const ownerGroup = document.createElement("div");

      const ownerGroups = state.availableOwners.length > 0 ? state.availableOwners : [
        {
          group: "Students",
          options: [
            { value: "student:STU-001", label: "Peter Kim" },
            { value: "student:STU-002", label: "Paul Kim" }
          ]
        },

          group: "Staff & Coaches",
          options: [
            { value: "staff:PTR-JOSH-RAGBIR", label: "Josh Ragbir" },
            { value: "staff:STF-KANGHO", label: "Kangho Kim" }
          ]
        },
        {
          group: "Roles & Family Labels",
          options: [
            { value: "label:Parent (General)", label: "Parent (General)" },
            { value: "label:Paul's Dad", label: "Paul's Dad" },

          ]
        }
      ];

          }

      });

      // 5. Actions
      const actions = document.createElement("div");
      actions.className = "edit-actions";

      const cancelBtn = document.createElement("button");
      cancelBtn.type = "button";
      cancelBtn.className = "cancel-button";
      cancelBtn.textContent = "Cancel";
      cancelBtn.onclick = () => {
        state.editingTaskId = null;
        renderProjects();
      };

      const isSubmitting = state.submittingTaskId === task.workItemId;
      const saveBtn = document.createElement("button");
      saveBtn.type = "submit";
